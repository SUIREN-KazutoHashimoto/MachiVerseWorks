name: Finalize Phase 1 roadmap

on:
  push:
    branches:
      - feature/phase-1-project-skeleton

permissions:
  contents: write

jobs:
  update-roadmap:
    name: update roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark Phase 1 complete
        shell: python
        run: |
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '> **現在:** Phase 0 — リポジトリ初期セットアップ完了  \n> **次の実装タスク:** `SKL-001` — ルートに `MachiVerseWorks.slnx` を作成する':
                  '> **現在:** Phase 1 — 開発プロジェクト骨格完了  \n> **次の実装タスク:** `SIM-001` — Simulation の tick rate を保持する設定型を作る',
              '| 1 | 開発プロジェクト骨格 | ⏭️ 次 |': '| 1 | 開発プロジェクト骨格 | ✅ 完了 |',
              '| 2 | Simulation Core 最小 PoC | ⏳ 待機 |': '| 2 | Simulation Core 最小 PoC | ⏭️ 次 |',
              '`SET-001` から `SET-021` まで完了しました。通常開発への移行が明示されるまでは、`AGENTS.md` の初期セットアップ例外に従い application version のカウントアップとルート `VERSION` の作成は行いません。':
                  '`SET-001` から `SET-021` まで完了しました。Phase 1 の着手時点で通常開発へ移行し、以後は `AGENTS.md` の通常開発ルールに従ってルート `VERSION` を application version の正本として運用します。',
              '> **状態: ⏭️ 次**  ': '> **状態: ✅ 完了**  ',
              '<summary><strong>Phase 2 — Simulation Core 最小 PoC（待機）</strong></summary>':
                  '<summary><strong>Phase 2 — Simulation Core 最小 PoC（次）</strong></summary>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected ROADMAP text was not found: {old}')
              text = text.replace(old, new, 1)

          completed = 0
          for number in range(1, 29):
              task_id = f'SKL-{number:03d}'
              old = f'- ⬜ **{task_id}**'
              new = f'- ✅ **{task_id}**'
              if old not in text:
                  raise SystemExit(f'Expected task was not found: {task_id}')
              text = text.replace(old, new, 1)
              completed += 1

          if completed != 28 or '- ⬜ **SKL-' in text:
              raise SystemExit('Phase 1 task completion validation failed')

          path.write_text(text, encoding='utf-8')

      - name: Increment patch version
        shell: python
        run: |
          from pathlib import Path

          path = Path('VERSION')
          major, minor, patch = map(int, path.read_text(encoding='utf-8').strip().split('.'))
          path.write_text(f'{major}.{minor}.{patch + 1}\n', encoding='utf-8')

      - name: Commit roadmap update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md VERSION
          git commit -m 'Phase 1完了をROADMAPへ反映'
          git push
