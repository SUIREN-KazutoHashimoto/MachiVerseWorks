name: Worker1 Batch3 Patch

on:
  push:
    branches:
      - fix/all-open-issues-worker-1
    paths:
      - .github/workflows/worker1-batch3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-open-issues-worker-1
          fetch-depth: 0
      - name: Apply batch 3 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path); text = p.read_text()
              if text.count(old) < count:
                  raise RuntimeError(f'{path}: missing pattern {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          def regex_replace(path, pattern, replacement, count=1):
              p = Path(path); text = p.read_text()
              new, n = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if n != count:
                  raise RuntimeError(f'{path}: regex matched {n}, expected {count}')
              p.write_text(new)

          # #243: expose TransitCount without changing the legacy 2.5-2.20 payload layout.
          replace('src/MachiVerseWorks.Protocol/ProtocolVersion.cs',
              'public static ProtocolVersion Current => new(2, 20);',
              'public static ProtocolVersion Current => new(2, 21);')
          replace('src/MachiVerseWorks.Protocol/ProtocolVersion.cs',
              '    public bool SupportsEntityInspection => Major == 2 && Minor >= 20;\n',
              '    public bool SupportsEntityInspection => Major == 2 && Minor >= 20;\n    public bool SupportsPopulationTransitCount => Major == 2 && Minor >= 21;\n')
          replace('src/MachiVerseWorks.Protocol/Messages.cs',
              '    uint ErrandCount,\n    ulong TickCount) : IProtocolMessage',
              '    uint ErrandCount,\n    ulong TickCount,\n    uint TransitCount = 0) : IProtocolMessage')
          codec = 'src/MachiVerseWorks.Protocol/PopulationProtocolCodec.cs'
          replace(codec,
              '    private const int PopulationStatisticsPayloadLength = 56;\n',
              '    private const int PopulationStatisticsPayloadLength = 56;\n    private const int PopulationStatisticsWithTransitPayloadLength = 60;\n')
          replace(codec,
              '            PopulationStatisticsMessage => PopulationStatisticsPayloadLength,',
              '            PopulationStatisticsMessage => version.SupportsPopulationTransitCount ? PopulationStatisticsWithTransitPayloadLength : PopulationStatisticsPayloadLength,')
          replace(codec, '                WriteStatistics(payload, statistics);', '                WriteStatistics(payload, statistics, version);')
          replace(codec,
              '''            case MessageType.PopulationStatistics:\n                if (payload.Length != PopulationStatisticsPayloadLength)\n                {\n                    error = ProtocolDecodeError.InvalidPayload;\n                    return false;\n                }\n                message = ReadStatistics(payload);\n                break;''',
              '''            case MessageType.PopulationStatistics:\n                var expectedStatisticsLength = header.Version.SupportsPopulationTransitCount\n                    ? PopulationStatisticsWithTransitPayloadLength\n                    : PopulationStatisticsPayloadLength;\n                if (payload.Length != expectedStatisticsLength)\n                {\n                    error = ProtocolDecodeError.InvalidPayload;\n                    return false;\n                }\n                message = ReadStatistics(payload, header.Version);\n                break;''')
          replace(codec,
              '    private static void WriteStatistics(Span<byte> payload, PopulationStatisticsMessage message)\n',
              '    private static void WriteStatistics(Span<byte> payload, PopulationStatisticsMessage message, ProtocolVersion version)\n')
          replace(codec,
              '        WriteUInt64(payload[48..], message.TickCount);\n    }\n\n    private static PopulationStatisticsMessage ReadStatistics(ReadOnlySpan<byte> payload) => new(',
              '        WriteUInt64(payload[48..], message.TickCount);\n        if (version.SupportsPopulationTransitCount) WriteUInt32(payload[56..], message.TransitCount);\n    }\n\n    private static PopulationStatisticsMessage ReadStatistics(ReadOnlySpan<byte> payload, ProtocolVersion version) => new(')
          replace(codec,
              '        ReadUInt32(payload[44..]),\n        ReadUInt64(payload[48..]));',
              '        ReadUInt32(payload[44..]),\n        ReadUInt64(payload[48..]),\n        version.SupportsPopulationTransitCount ? ReadUInt32(payload[56..]) : 0u);')
          mapper = 'src/MachiVerseWorks.Server/PopulationMessageMapper.cs'
          p = Path(mapper); text = p.read_text()
          text = re.sub(r'(statistics\.ErrandCount,\s*statistics\.TickCount)(\s*\))', r'\1,\n            statistics.TransitCount\2', text, count=1)
          p.write_text(text)

          # #244: validate the entire power solver result before committing any demand/dispatch state.
          power = 'src/MachiVerseWorks.Simulation/SimulationWorld.Power.cs'
          regex_replace(power, r'    private void StepPower\(SimulationTime nextTime\)\n    \{.*?\n    \}\n\n    private double CalculatePowerDemand', '''    private void StepPower(SimulationTime nextTime)\n    {\n        var calculatedDemands = _powerLoads\n            .OrderBy(static item => item.Id.Value)\n            .Select(load => (Load: load, Demand: CalculatePowerDemand(load, nextTime)))\n            .ToArray();\n        var demandByLoad = calculatedDemands.ToDictionary(static item => item.Load.Id, static item => item.Demand);\n        var request = new PowerDispatchRequest(\n            _powerNodes.OrderBy(static item => item.Id.Value).Select(static item => new PowerDispatchNode(item.Id)).ToArray(),\n            _powerLines.OrderBy(static item => item.Id.Value).Select(static item => new PowerDispatchLine(item.Id, item.FromNodeId, item.ToNodeId, item.CapacityMegawatts, item.IsInService)).ToArray(),\n            _powerGenerators.OrderBy(static item => item.Id.Value).Select(static item => new PowerDispatchGenerator(\n                item.Id, item.NodeId, item.OperatingState == GeneratorOperatingState.Online ? item.CapacityMegawatts : 0d)).ToArray(),\n            _powerLoads.OrderBy(static item => item.Id.Value).Select(item => new PowerDispatchLoad(item.Id, item.NodeId, demandByLoad[item.Id])).ToArray());\n        var result = _powerDispatchSolver.Solve(request) ?? throw new InvalidOperationException("Power dispatch solver returned no result.");\n        ArgumentNullException.ThrowIfNull(result.Generators);\n        ArgumentNullException.ThrowIfNull(result.Loads);\n\n        var generatorOutputs = new Dictionary<GeneratorId, double>();\n        foreach (var dispatch in result.Generators)\n        {\n            if (!_powerGeneratorIndex.TryGetValue(dispatch.GeneratorId, out var generator) || !generatorOutputs.TryAdd(dispatch.GeneratorId, dispatch.OutputMegawatts))\n                throw new InvalidOperationException("Power dispatch solver returned an unknown or duplicate Generator.");\n            if (!double.IsFinite(dispatch.OutputMegawatts) || dispatch.OutputMegawatts < 0d || dispatch.OutputMegawatts > generator.CapacityMegawatts + PowerDefaults.SupplyEpsilonMegawatts)\n                throw new InvalidOperationException($"Power dispatch solver returned invalid output for Generator {dispatch.GeneratorId.Value}.");\n        }\n        var servedLoads = new Dictionary<PowerLoadId, double>();\n        foreach (var dispatch in result.Loads)\n        {\n            if (!_powerLoadIndex.TryGetValue(dispatch.LoadId, out var load) || !servedLoads.TryAdd(dispatch.LoadId, dispatch.ServedMegawatts))\n                throw new InvalidOperationException("Power dispatch solver returned an unknown or duplicate Load.");\n            var demand = demandByLoad[load.Id];\n            if (!double.IsFinite(dispatch.ServedMegawatts) || dispatch.ServedMegawatts < 0d || dispatch.ServedMegawatts > demand + PowerDefaults.SupplyEpsilonMegawatts)\n                throw new InvalidOperationException($"Power dispatch solver returned invalid served demand for Load {dispatch.LoadId.Value}.");\n        }\n\n        foreach (var item in calculatedDemands) item.Load.DemandMegawatts = item.Demand;\n        foreach (var generator in _powerGenerators)\n        {\n            var output = generatorOutputs.GetValueOrDefault(generator.Id);\n            generator.OutputMegawatts = generator.OperatingState == GeneratorOperatingState.Online ? Math.Min(generator.CapacityMegawatts, output) : 0d;\n        }\n        foreach (var load in _powerLoads)\n        {\n            var served = servedLoads.GetValueOrDefault(load.Id);\n            load.ServedMegawatts = Math.Min(load.DemandMegawatts, served);\n            load.UnservedMegawatts = Math.Max(0d, load.DemandMegawatts - load.ServedMegawatts);\n            load.SupplyState = load.UnservedMegawatts <= PowerDefaults.SupplyEpsilonMegawatts\n                ? PowerSupplyState.Supplied\n                : load.ServedMegawatts <= PowerDefaults.SupplyEpsilonMegawatts\n                    ? PowerSupplyState.Outage\n                    : PowerSupplyState.Constrained;\n        }\n    }\n\n    private double CalculatePowerDemand''')

          # #248: calculate all checked railway dwell values before mutating delay/state.
          railway = 'src/MachiVerseWorks.Simulation/Internal/RailwayOperationsStore.cs'
          replace(railway, '''        var arrivalDelay = tickCount > stop.PlannedArrivalTick ? tickCount - stop.PlannedArrivalTick : 0;\n        if (arrivalDelay > service.DelayTicks) service.DelayTicks = arrivalDelay;\n        var delayedPlannedDeparture = checked(stop.PlannedDepartureTick + service.DelayTicks);\n        var minimumDwellDeparture = checked(tickCount + stop.MinimumDwellTicks);\n        train.DwellDepartureTick = Math.Max(delayedPlannedDeparture, minimumDwellDeparture);''', '''        var arrivalDelay = tickCount > stop.PlannedArrivalTick ? tickCount - stop.PlannedArrivalTick : 0;\n        var nextDelayTicks = Math.Max(service.DelayTicks, arrivalDelay);\n        var delayedPlannedDeparture = checked(stop.PlannedDepartureTick + nextDelayTicks);\n        var minimumDwellDeparture = checked(tickCount + stop.MinimumDwellTicks);\n        var dwellDepartureTick = Math.Max(delayedPlannedDeparture, minimumDwellDeparture);\n        service.DelayTicks = nextDelayTicks;\n        train.DwellDepartureTick = dwellDepartureTick;''')

          # #251: self-exclusion and front-to-back update order for road traffic.
          occupancy = 'src/MachiVerseWorks.Simulation/Internal/LaneOccupancyIndex.cs'
          regex_replace(occupancy, r'    public bool TryGetLeader\(LaneId laneId, double progressMeters, out OccupancyNeighbor leader\)\n    \{.*?\n    \}\n\n    public bool CanOccupy', '''    public bool TryGetLeader(LaneId laneId, double progressMeters, out OccupancyNeighbor leader) =>\n        TryGetLeader(laneId, progressMeters, default, out leader);\n\n    public bool TryGetLeader(LaneId laneId, double progressMeters, VehicleId excludedId, out OccupancyNeighbor leader)\n    {\n        if (!entriesByLane.TryGetValue(laneId, out var set) || set.Count == 0) { leader = default; return false; }\n        var view = set.GetViewBetween(\n            new Entry(progressMeters, new VehicleId(0), 0d, 0d),\n            new Entry(double.PositiveInfinity, new VehicleId(ulong.MaxValue), double.MaxValue, double.MaxValue));\n        foreach (var entry in view)\n        {\n            if (entry.Id == excludedId) continue;\n            leader = new OccupancyNeighbor(entry.Id, entry.ProgressMeters, entry.LengthMeters, entry.SpeedMetersPerSecond);\n            return true;\n        }\n        leader = default;\n        return false;\n    }\n\n    public bool CanOccupy''')
          vehicles = 'src/MachiVerseWorks.Simulation/Internal/VehicleStore.cs'
          replace(vehicles,
              '        foreach (var id in orderedIds)\n        {\n            var vehicle = vehicles[id];\n            if (vehicle.State == VehicleMovementState.Arrived) continue;\n            if (!occupancy.Remove(id))',
              '''        var updateOrder = orderedIds\n            .Where(id => vehicles[id].State != VehicleMovementState.Arrived)\n            .OrderBy(id => vehicles[id].CurrentStep.LaneId.Value)\n            .ThenByDescending(id => topology.GetLaneTravelProgress(vehicles[id].CurrentStep.LaneId, vehicles[id].SegmentOffset))\n            .ThenBy(static id => id.Value)\n            .ToArray();\n        foreach (var id in updateOrder)\n        {\n            var vehicle = vehicles[id];\n            if (!occupancy.Remove(id))''')
          replace(vehicles,
              'if (occupancyIndex.TryGetLeader(vehicle.CurrentStep.LaneId, laneProgress, out var leader))',
              'if (occupancyIndex.TryGetLeader(vehicle.CurrentStep.LaneId, laneProgress, vehicle.Id, out var leader))')

          # #252: stable finite radio propagation calculations for legal finite extremes.
          radio_solver = 'src/MachiVerseWorks.Simulation/DeterministicRadioPropagationSolver.cs'
          Path(radio_solver).write_text('''namespace MachiVerseWorks.Simulation;\n\npublic sealed class DeterministicRadioPropagationSolver(IRadioPathCorrection? pathCorrection = null) : IRadioPropagationSolver\n{\n    private readonly IRadioPathCorrection _pathCorrection = pathCorrection ?? new NoRadioPathCorrection();\n\n    public RadioPropagationResult Solve(RadioPropagationRequest request)\n    {\n        RadioValidation.ValidatePropagationRequest(request);\n        var distanceMeters = CalculateDistanceMeters(request.Transmitter.Position, request.Receiver.Position);\n        var distanceKilometers = Math.Max(distanceMeters / 1_000d, 0.001d);\n        var frequencyMegahertz = request.FrequencyBlock.CenterFrequencyMegahertz;\n        var freeSpacePathLossDb = SaturatingAdd(32.44d, SaturatingAdd(20d * Math.Log10(distanceKilometers), 20d * Math.Log10(frequencyMegahertz)));\n        var frequencyDependentLossDb = CalculateFrequencyDependentAttenuationDb(frequencyMegahertz, distanceKilometers);\n        var correctionDb = _pathCorrection.CalculateAdditionalLossDb(request, distanceMeters);\n        if (!double.IsFinite(correctionDb) || correctionDb < 0d)\n            throw new InvalidOperationException("Radio path correction must return a finite non-negative loss.");\n\n        var pathLossDb = SaturatingAdd(freeSpacePathLossDb, frequencyDependentLossDb);\n        pathLossDb = SaturatingAdd(pathLossDb, request.ObstructionLossDb);\n        pathLossDb = SaturatingAdd(pathLossDb, correctionDb);\n        var transmitter = request.LinkBudget.Transmitter;\n        var receivedPowerDbm = transmitter.EffectiveRadiatedPower.Dbm;\n        receivedPowerDbm = SaturatingSubtract(receivedPowerDbm, transmitter.FeederLossDb);\n        receivedPowerDbm = SaturatingSubtract(receivedPowerDbm, transmitter.MiscellaneousLossDb);\n        receivedPowerDbm = SaturatingSubtract(receivedPowerDbm, pathLossDb);\n        receivedPowerDbm = SaturatingAdd(receivedPowerDbm, request.Receiver.AntennaGainDb);\n        receivedPowerDbm = SaturatingAdd(receivedPowerDbm, request.LinkBudget.ReceiveAntennaGainDb);\n        var effectiveNoiseDbm = CombinePowersDbm(request.NoiseFloorDbm, request.InterferenceDbm);\n        var sinrDb = SaturatingSubtract(receivedPowerDbm, effectiveNoiseDbm);\n        var minimumReceiveDbm = SaturatingAdd(request.LinkBudget.ReceiverSensitivityDbm, request.LinkBudget.FadeMarginDb);\n        var reachable = receivedPowerDbm >= minimumReceiveDbm;\n        return new RadioPropagationResult(distanceMeters, pathLossDb, receivedPowerDbm, request.InterferenceDbm, sinrDb, reachable);\n    }\n\n    private static double CalculateDistanceMeters(WorldPoint left, WorldPoint right)\n    {\n        var dx = AbsoluteDifference(left.X, right.X);\n        var dy = AbsoluteDifference(left.Y, right.Y);\n        var dz = AbsoluteDifference(left.Z, right.Z);\n        var scale = Math.Max(dx, Math.Max(dy, dz));\n        if (scale == 0d) return 0d;\n        var norm = Math.Sqrt((dx / scale * (dx / scale)) + (dy / scale * (dy / scale)) + (dz / scale * (dz / scale)));\n        return scale > double.MaxValue / norm ? double.MaxValue : scale * norm;\n    }\n\n    private static double AbsoluteDifference(double left, double right)\n    {\n        if ((left >= 0d && right < 0d) || (left < 0d && right >= 0d))\n        {\n            var a = Math.Abs(left);\n            var b = Math.Abs(right);\n            return a > double.MaxValue - b ? double.MaxValue : a + b;\n        }\n        return Math.Abs(left - right);\n    }\n\n    private static double CalculateFrequencyDependentAttenuationDb(double frequencyMegahertz, double distanceKilometers)\n    {\n        if (frequencyMegahertz <= 6_000d) return 0d;\n        var normalized = Math.Min(1d, (frequencyMegahertz - 6_000d) / 54_000d);\n        var scaled = normalized * 0.8d;\n        return distanceKilometers > double.MaxValue / scaled ? double.MaxValue : distanceKilometers * scaled;\n    }\n\n    internal static double CombinePowersDbm(double firstDbm, double secondDbm)\n    {\n        var maximum = Math.Max(firstDbm, secondDbm);\n        var minimum = Math.Min(firstDbm, secondDbm);\n        var delta = SaturatingSubtract(minimum, maximum) / 10d;\n        var scaled = delta < -324d ? 0d : Math.Pow(10d, delta);\n        return SaturatingAdd(maximum, 10d * Math.Log10(1d + scaled));\n    }\n\n    private static double SaturatingAdd(double left, double right)\n    {\n        if (right > 0d && left > double.MaxValue - right) return double.MaxValue;\n        if (right < 0d && left < -double.MaxValue - right) return -double.MaxValue;\n        return left + right;\n    }\n\n    private static double SaturatingSubtract(double left, double right) =>\n        right >= 0d\n            ? (left < -double.MaxValue + right ? -double.MaxValue : left - right)\n            : (left > double.MaxValue + right ? double.MaxValue : left - right);\n}\n''')
          radio = 'src/MachiVerseWorks.Simulation/SimulationWorld.Radio.cs'
          replace(radio,
              '        var interferingMilliwatts = 0d;\n',
              '        var combinedInterferenceDbm = -300d;\n        var hasInterference = false;\n')
          replace(radio,
              '            interferingMilliwatts += Math.Pow(10d, result.ReceivedPowerDbm / 10d);\n        }\n        return interferingMilliwatts <= 0d ? -300d : 10d * Math.Log10(interferingMilliwatts);',
              '            combinedInterferenceDbm = hasInterference\n                ? DeterministicRadioPropagationSolver.CombinePowersDbm(combinedInterferenceDbm, result.ReceivedPowerDbm)\n                : result.ReceivedPowerDbm;\n            hasInterference = true;\n        }\n        return hasInterference ? combinedInterferenceDbm : -300d;')

          # #263: saturate legal Logistics aggregates.
          logistics = 'src/MachiVerseWorks.Simulation/SimulationWorld.Logistics.cs'
          replace(logistics,
              '        foreach (var inventory in _logisticsInventories.Values) inventoryUnits += inventory.Quantity;',
              '        foreach (var inventory in _logisticsInventories.Values) inventoryUnits = SimulationNumeric.SaturatingAddNonNegative(inventoryUnits, inventory.Quantity);')
          replace(logistics,
              '                inTransitUnits += shipment.Quantity;',
              '                inTransitUnits = SimulationNumeric.SaturatingAddNonNegative(inTransitUnits, shipment.Quantity);')

          # #274: make Optical result application validate everything before any mutation.
          optical = 'src/MachiVerseWorks.Simulation/SimulationWorld.Optical.cs'
          regex_replace(optical, r'    private void ApplyOpticalRoutingResult\(OpticalRoutingResult result\)\n    \{.*?\n    \}\n\n    private OpticalQualityState CalculateOpticalQuality', '''    private void ApplyOpticalRoutingResult(OpticalRoutingResult result)\n    {\n        ArgumentNullException.ThrowIfNull(result.Demands);\n        ArgumentNullException.ThrowIfNull(result.FiberCables);\n        ArgumentNullException.ThrowIfNull(result.Backhauls);\n        var routes = new Dictionary<OpticalDemandId, OpticalDemandRouteResult>();\n        foreach (var route in result.Demands)\n        {\n            if (!_opticalDemandIndex.ContainsKey(route.DemandId) || !routes.TryAdd(route.DemandId, route))\n                throw new InvalidOperationException("Optical routing solver returned an unknown or duplicate Demand.");\n            if (route.RouteCableIds is null) throw new InvalidOperationException("Optical routing solver returned a null route.");\n        }\n        var cableLoads = new Dictionary<FiberCableId, double>();\n        foreach (var load in result.FiberCables)\n        {\n            if (!_fiberCableIndex.TryGetValue(load.FiberCableId, out var cable) || !cableLoads.TryAdd(load.FiberCableId, load.LoadGigabitsPerSecond))\n                throw new InvalidOperationException("Optical routing solver returned an unknown or duplicate FiberCable.");\n            if (!double.IsFinite(load.LoadGigabitsPerSecond) || load.LoadGigabitsPerSecond < 0d || load.LoadGigabitsPerSecond > cable.CapacityGigabitsPerSecond + OpticalDefaults.BandwidthEpsilonGigabitsPerSecond)\n                throw new InvalidOperationException($"Optical routing solver returned invalid load for FiberCable {load.FiberCableId.Value}.");\n        }\n        var backhaulLoads = new Dictionary<OpticalBackhaulId, double>();\n        foreach (var load in result.Backhauls)\n        {\n            if (!_opticalBackhaulIndex.TryGetValue(load.BackhaulId, out var backhaul) || !backhaulLoads.TryAdd(load.BackhaulId, load.AllocatedGigabitsPerSecond))\n                throw new InvalidOperationException("Optical routing solver returned an unknown or duplicate Backhaul.");\n            if (!double.IsFinite(load.AllocatedGigabitsPerSecond) || load.AllocatedGigabitsPerSecond < 0d || load.AllocatedGigabitsPerSecond > backhaul.CapacityGigabitsPerSecond + OpticalDefaults.BandwidthEpsilonGigabitsPerSecond)\n                throw new InvalidOperationException($"Optical routing solver returned invalid load for Backhaul {load.BackhaulId.Value}.");\n        }\n        foreach (var demand in _opticalDemands)\n        {\n            if (!routes.TryGetValue(demand.Id, out var route)) continue;\n            if (!double.IsFinite(route.AllocatedGigabitsPerSecond) || route.AllocatedGigabitsPerSecond < 0d || route.AllocatedGigabitsPerSecond > demand.DemandGigabitsPerSecond + OpticalDefaults.BandwidthEpsilonGigabitsPerSecond)\n                throw new InvalidOperationException($"Optical routing solver returned invalid allocation for Demand {demand.Id.Value}.");\n            foreach (var cableId in route.RouteCableIds)\n                if (!_fiberCableIndex.ContainsKey(cableId)) throw new InvalidOperationException($"Optical routing solver returned unknown FiberCable {cableId.Value}.");\n            if (route.BackhaulId is { } backhaulId && !_opticalBackhaulIndex.ContainsKey(backhaulId))\n                throw new InvalidOperationException($"Optical routing solver returned unknown Backhaul {backhaulId.Value}.");\n        }\n\n        foreach (var cable in _fiberCables)\n        {\n            var load = cableLoads.GetValueOrDefault(cable.Id);\n            cable.LoadGigabitsPerSecond = cable.IsInService ? Math.Min(cable.CapacityGigabitsPerSecond, load) : 0d;\n        }\n        foreach (var backhaul in _opticalBackhauls)\n        {\n            var load = backhaulLoads.GetValueOrDefault(backhaul.Id);\n            backhaul.AllocatedGigabitsPerSecond = backhaul.IsInService ? Math.Min(backhaul.CapacityGigabitsPerSecond, load) : 0d;\n        }\n        foreach (var demand in _opticalDemands)\n        {\n            if (!routes.TryGetValue(demand.Id, out var route)) route = new OpticalDemandRouteResult(demand.Id, null, 0d, Array.Empty<FiberCableId>());\n            demand.AllocatedGigabitsPerSecond = Math.Min(demand.DemandGigabitsPerSecond, route.AllocatedGigabitsPerSecond);\n            demand.BackhaulId = demand.AllocatedGigabitsPerSecond > OpticalDefaults.BandwidthEpsilonGigabitsPerSecond ? route.BackhaulId : null;\n            demand.RouteCableIds = demand.AllocatedGigabitsPerSecond > OpticalDefaults.BandwidthEpsilonGigabitsPerSecond ? route.RouteCableIds.ToArray() : Array.Empty<FiberCableId>();\n        }\n        foreach (var demand in _opticalDemands) demand.QualityState = CalculateOpticalQuality(demand);\n    }\n\n    private OpticalQualityState CalculateOpticalQuality''')

          # #275: make radio plan calculation two-phase, then rollback public mutations if recalc fails.
          regex_replace(radio, r'    public void RecalculateRadioPlan\(\)\n    \{.*?\n    \}\n\n    private void StepRadio', '''    public void RecalculateRadioPlan()\n    {\n        var updates = new List<(RadioLinkStateData Link, RadioPropagationResult Propagation, RadioLinkState State)>();\n        foreach (var link in _radioLinks.OrderBy(static item => item.Id.Value))\n        {\n            if (!IsRadioLinkOperational(link))\n            {\n                updates.Add((link, default, RadioLinkState.OutOfService));\n                continue;\n            }\n            RadioPropagationRequest request;\n            if (_radioLinkEntityBindings.TryGetValue(link.Id, out var binding))\n            {\n                var interferenceDbm = CalculateExplicitInterferenceDbm(link, binding);\n                if (!TryCreateExplicitRadioPropagationRequest(link, interferenceDbm, out request))\n                    throw new InvalidOperationException($"Radio link {link.Id.Value} has an invalid explicit entity binding.");\n            }\n            else\n            {\n                var transmitter = CreateRadioSiteSnapshot(_radioSiteIndex[link.FromSiteId]);\n                var receiver = CreateRadioSiteSnapshot(_radioSiteIndex[link.ToSiteId]);\n                var block = _frequencyBlockIndex[link.FrequencyBlockId];\n                var interferenceDbm = CalculateLegacyInterferenceDbm(link, receiver);\n                var obstruction = CalculateRadioBuildingObstruction(transmitter.Position, receiver.Position);\n                request = new RadioPropagationRequest(transmitter, receiver, block, link.LinkBudget, interferenceDbm, RadioDefaults.ThermalNoiseFloorDbm, obstruction.LossDb, obstruction.IsLineOfSight);\n            }\n            var result = _radioPropagationSolver.Solve(request);\n            if (!double.IsFinite(result.DistanceMeters) || !double.IsFinite(result.PathLossDb) || !double.IsFinite(result.ReceivedPowerDbm) || !double.IsFinite(result.InterferenceDbm) || !double.IsFinite(result.SinrDb))\n                throw new InvalidOperationException("Radio propagation solver returned a non-finite result.");\n            var state = !result.IsReachable ? RadioLinkState.Unreachable\n                : result.SinrDb < RadioDefaults.MinimumSinrDb ? RadioLinkState.Interfered\n                : result.SinrDb < RadioDefaults.MarginalSinrDb ? RadioLinkState.Marginal : RadioLinkState.Healthy;\n            updates.Add((link, result, state));\n        }\n        foreach (var update in updates)\n        {\n            update.Link.Propagation = update.Propagation;\n            update.Link.State = update.State;\n        }\n    }\n\n    private void StepRadio''')
          # Public mutation rollback using previous property values; Recalculate is now atomic.
          replace(radio,
              '        site.IsInService = isInService;\n        RecalculateRadioPlan();',
              '        var previous = site.IsInService;\n        site.IsInService = isInService;\n        try { RecalculateRadioPlan(); } catch { site.IsInService = previous; throw; }')
          replace(radio,
              '        link.IsInService = isInService;\n        RecalculateRadioPlan();',
              '        var previous = link.IsInService;\n        link.IsInService = isInService;\n        try { RecalculateRadioPlan(); } catch { link.IsInService = previous; throw; }')
          replace(radio,
              '        link.Utilization = utilization;\n        RecalculateRadioPlan();',
              '        var previous = link.Utilization;\n        link.Utilization = utilization;\n        try { RecalculateRadioPlan(); } catch { link.Utilization = previous; throw; }')
          regex_replace(radio, r'        var id = new RadioLinkId\(_nextRadioLinkId\+\+\);\n        var state = new RadioLinkStateData\(id, fromSiteId, toSiteId, frequencyBlockId, linkBudget, utilization, isInService\);\n        _radioLinks.Add\(state\);\n        _radioLinkIndex.Add\(id, state\);\n        RecalculateRadioPlan\(\);\n        return id;', '''        var id = new RadioLinkId(_nextRadioLinkId);\n        var state = new RadioLinkStateData(id, fromSiteId, toSiteId, frequencyBlockId, linkBudget, utilization, isInService);\n        _radioLinks.Add(state);\n        _radioLinkIndex.Add(id, state);\n        try\n        {\n            RecalculateRadioPlan();\n            _nextRadioLinkId++;\n            return id;\n        }\n        catch\n        {\n            _radioLinks.Remove(state);\n            _radioLinkIndex.Remove(id);\n            throw;\n        }''')

          # #277 (and the same bus hazard): precompute checked ETA before spawning road vehicles.
          transit = 'src/MachiVerseWorks.Simulation/SimulationWorld.MultimodalTransit.cs'
          replace(transit,
