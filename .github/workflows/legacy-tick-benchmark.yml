name: Legacy Tick Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-tick-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-tick:
    name: legacy-tick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          lscpu
          free -h
          dotnet --info
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Build benchmark
        run: dotnet build benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore
      - name: Run tick benchmark
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-build -- --warmup 60 --ticks 200
