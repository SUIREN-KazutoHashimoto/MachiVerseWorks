name: Snapshot Read Model Benchmark

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'benchmarks/**'
      - 'src/MachiVerseWorks.Server/**'
      - 'src/MachiVerseWorks.Simulation/**'
      - '.github/workflows/snapshot-readmodel-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-readmodel-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-client-read-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Run 10/100 client benchmark
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/snapshot-readmodel-benchmark
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore -- --filter '*PublishedReadModelBenchmarks*' --job short
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-readmodel-benchmark
          path: .artifacts/snapshot-readmodel-benchmark
          if-no-files-found: warn
          retention-days: 14
