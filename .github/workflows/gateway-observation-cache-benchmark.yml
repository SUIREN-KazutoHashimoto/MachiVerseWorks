name: Gateway Observation Cache Benchmark

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/server/**'
      - 'src/protocol/**'
      - 'src/simulation/Agent*.cs'
      - 'src/simulation/Geometry.cs'
      - 'src/simulation/*Snapshot*.cs'
      - 'src/simulation/*ReadModel*.cs'
      - 'src/simulation/RoadNetwork*.cs'
      - 'src/simulation/Railway*.cs'
      - 'src/simulation/Intersection*.cs'
      - 'benchmarks/MachiVerseWorks.Benchmarks/ObservationCacheBenchmarks.cs'
      - 'benchmarks/MachiVerseWorks.Benchmarks/ObservationCacheBenchmarkRunner.cs'
      - 'benchmarks/MachiVerseWorks.Benchmarks/Program.cs'
      - 'benchmarks/MachiVerseWorks.Benchmarks/PerformanceBenchmarkConfig.cs'
      - 'benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj'
      - '.github/workflows/gateway-observation-cache-benchmark.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-observation-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: cache-hit-cpu-allocation-encoding-memory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx

      - name: Build benchmark project
        run: dotnet build benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore

      - name: Record cache metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/benchmarks/gateway-observation-cache
          dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-build -- --observation-cache \
            | tee .artifacts/benchmarks/gateway-observation-cache/metrics.csv

      - name: Run BenchmarkDotNet
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/gateway-observation-cache
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-build -- --filter '*ObservationCacheBenchmarks*' --job short

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-gateway-observation-cache
          path: .artifacts/benchmarks/gateway-observation-cache
          if-no-files-found: error
          retention-days: 14
