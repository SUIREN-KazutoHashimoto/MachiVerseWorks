name: Worker1 Review Fixes

on:
  push:
    branches:
      - fix/all-open-issues-worker-1
    paths:
      - .github/workflows/worker1-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"{label}: expected text not found")
              file.write_text(text.replace(old, new, 1))

          # Preserve every finite positive lane width accepted by the existing save contract.
          path = "src/MachiVerseWorks.Simulation/Internal/RoadNetworkStore.cs"
          replace_once(
              path,
              "    internal const double MaximumLaneWidthMeters = 25d;\n    internal const double MaximumDirectionalRoadwayWidthMeters = 250d;\n\n",
              "",
              "road width constants",
          )
          replace_once(
              path,
              """        if (!double.IsFinite(width) || width <= 0d || width > MaximumLaneWidthMeters)
              throw new ArgumentOutOfRangeException(nameof(width), width, $"Lane width must be greater than zero and at most {MaximumLaneWidthMeters} meters.");
""",
              """        if (!double.IsFinite(width) || width <= 0d)
              throw new ArgumentOutOfRangeException(nameof(width), width, "Lane width must be finite and greater than zero.");
""",
              "road lane width validation",
          )
          replace_once(
              path,
              """        var totalWidth = width;
          foreach (var lane in lanes.Values)
          {
              if (lane.Id == excluding || lane.SegmentId != segment || lane.Direction != direction) continue;
              totalWidth += lane.WidthMeters;
              if (!double.IsFinite(totalWidth) || totalWidth > MaximumDirectionalRoadwayWidthMeters)
                  throw new ArgumentOutOfRangeException(nameof(width), width, $"Total lane width for one segment direction cannot exceed {MaximumDirectionalRoadwayWidthMeters} meters.");
          }
""",
              """        var totalWidth = width;
          foreach (var lane in lanes.Values)
          {
              if (lane.Id == excluding || lane.SegmentId != segment || lane.Direction != direction) continue;
              if (lane.WidthMeters > double.MaxValue - totalWidth)
                  throw new ArgumentOutOfRangeException(nameof(width), width, "Total lane width for one segment direction must remain representable as a finite double.");
              totalWidth += lane.WidthMeters;
          }
""",
              "road aggregate width validation",
          )

          path = "src/MachiVerseWorks.Simulation/SimulationWorld.Roads.cs"
          replace_once(
              path,
              """            if (!segments.ContainsKey(lane.SegmentId)
                  || !double.IsFinite(lane.WidthMeters)
                  || lane.WidthMeters <= 0d
                  || lane.WidthMeters > RoadNetworkStore.MaximumLaneWidthMeters
                  || !double.IsFinite(lane.SpeedLimitMetersPerSecond)
                  || lane.SpeedLimitMetersPerSecond <= 0d)
""",
              """            if (!segments.ContainsKey(lane.SegmentId)
                  || !double.IsFinite(lane.WidthMeters)
                  || lane.WidthMeters <= 0d
                  || !double.IsFinite(lane.SpeedLimitMetersPerSecond)
                  || lane.SpeedLimitMetersPerSecond <= 0d)
""",
              "checkpoint lane width validation",
          )
          replace_once(
              path,
              """            var key = (lane.SegmentId, lane.Direction);
              var totalWidth = laneWidthsByDirection.GetValueOrDefault(key) + lane.WidthMeters;
              if (!double.IsFinite(totalWidth) || totalWidth > RoadNetworkStore.MaximumDirectionalRoadwayWidthMeters)
                  throw new ArgumentException($"Lane widths for Road segment {lane.SegmentId.Value} direction {lane.Direction} exceed the supported roadway width.", nameof(checkpoint));
              laneWidthsByDirection[key] = totalWidth;
""",
              """            var key = (lane.SegmentId, lane.Direction);
              var previousWidth = laneWidthsByDirection.GetValueOrDefault(key);
              if (lane.WidthMeters > double.MaxValue - previousWidth)
                  throw new ArgumentException($"Lane widths for Road segment {lane.SegmentId.Value} direction {lane.Direction} overflow the representable roadway width.", nameof(checkpoint));
              laneWidthsByDirection[key] = previousWidth + lane.WidthMeters;
""",
              "checkpoint aggregate width validation",
          )

          # Reuse occupancy ordering instead of globally sorting every active vehicle each tick.
          path = "src/MachiVerseWorks.Simulation/Internal/LaneOccupancyIndex.cs"
          replace_once(
              path,
              "    private readonly Dictionary<LaneId, SortedSet<Entry>> entriesByLane = [];\n    private readonly Dictionary<VehicleId, Location> locations = [];\n",
              "    private readonly Dictionary<LaneId, SortedSet<Entry>> entriesByLane = [];\n    private readonly SortedSet<LaneId> orderedLaneIds = new(LaneIdComparer.Instance);\n    private readonly Dictionary<VehicleId, Location> locations = [];\n",
              "occupancy ordered lanes field",
          )
          replace_once(
              path,
              "        entriesByLane.Clear();\n        locations.Clear();\n",
              "        entriesByLane.Clear();\n        orderedLaneIds.Clear();\n        locations.Clear();\n",
              "occupancy clear",
          )
          replace_once(
              path,
              "        if (!entriesByLane.TryGetValue(laneId, out var set)) { set = new SortedSet<Entry>(Comparer); entriesByLane.Add(laneId, set); }\n",
              "        if (!entriesByLane.TryGetValue(laneId, out var set)) { set = new SortedSet<Entry>(Comparer); entriesByLane.Add(laneId, set); orderedLaneIds.Add(laneId); }\n",
              "occupancy add lane",
          )
          replace_once(
              path,
              "        if (set.Count == 0) entriesByLane.Remove(location.LaneId);\n",
              "        if (set.Count == 0) { entriesByLane.Remove(location.LaneId); orderedLaneIds.Remove(location.LaneId); }\n",
              "occupancy remove lane",
          )
          marker = "    public bool TryGetLeader(LaneId laneId, double progressMeters, out OccupancyNeighbor leader) =>\n"
          method = """    public void CopyVehicleIdsFrontToBack(List<VehicleId> destination)
              {
                  ArgumentNullException.ThrowIfNull(destination);
                  destination.Clear();
                  if (destination.Capacity < locations.Count) destination.Capacity = locations.Count;
                  foreach (var laneId in orderedLaneIds)
                      foreach (var entry in entriesByLane[laneId].Reverse())
                          destination.Add(entry.Id);
              }

"""
          text = Path(path).read_text()
          if marker not in text:
              raise SystemExit("occupancy copy insertion marker not found")
          Path(path).write_text(text.replace(marker, method + marker, 1))
          marker = "    private sealed class EntryComparer : IComparer<Entry>\n"
          helper = """    private sealed class LaneIdComparer : IComparer<LaneId>
              {
                  public static LaneIdComparer Instance { get; } = new();
                  public int Compare(LaneId left, LaneId right) => left.Value.CompareTo(right.Value);
              }

"""
          text = Path(path).read_text()
          if marker not in text:
              raise SystemExit("lane comparer insertion marker not found")
          Path(path).write_text(text.replace(marker, helper + marker, 1))

          path = "src/MachiVerseWorks.Simulation/Internal/VehicleStore.cs"
          replace_once(
              path,
              "    private readonly List<VehicleId> orderedIds = [];\n    private readonly LaneOccupancyIndex occupancy = new();\n",
              "    private readonly List<VehicleId> orderedIds = [];\n    private readonly List<VehicleId> stepOrder = [];\n    private readonly LaneOccupancyIndex occupancy = new();\n",
              "vehicle reusable step order field",
          )
          replace_once(
              path,
              """        var updateOrder = orderedIds
              .Where(id => vehicles[id].State != VehicleMovementState.Arrived)
              .OrderBy(id => vehicles[id].CurrentStep.LaneId.Value)
              .ThenByDescending(id => topology.GetLaneTravelProgress(vehicles[id].CurrentStep.LaneId, vehicles[id].SegmentOffset))
              .ThenBy(static id => id.Value)
              .ToArray();
          foreach (var id in updateOrder)
""",
              """        occupancy.CopyVehicleIdsFrontToBack(stepOrder);
          foreach (var id in stepOrder)
""",
              "vehicle per-tick order",
          )

          # Keep the documented protocol layout in sync with 2.21.
          path = "docs/architecture/protocol.md"
          replace_once(
              path,
              "固定56 bytes。Household / Person、travel state、activity別countとtickを持つ。多数Person detailを毎publishで転送しない。",
              "Protocol 2.5〜2.20は固定56 bytes。Protocol 2.21以降は末尾に `TransitCount` (`uint32`) を追加した固定60 bytes。Household / Person、travel state、activity別countとtickを持つ。2.20以前のdecoderではTransit人数を0相当として扱う。多数Person detailを毎publishで転送しない。",
              "population protocol docs",
          )

          # Replace tests that encoded the accidental 25m/250m limits with compatibility/overflow tests.
          path = "tests/MachiVerseWorks.Simulation.Tests/Worker1FinalBatchRegressionTests.cs"
          text = Path(path).read_text()
          start = "    [TestMethod]\n    public void OversizedAndAggregateLaneWidthsAreRejectedBeforeCommit()\n"
          end = "    [TestMethod]\n    public void RailwayServicePatternUsesPlatformAwareStopIdentityForStationRevisit()\n"
          start_index = text.find(start)
          end_index = text.find(end, start_index)
          if start_index < 0 or end_index < 0:
              raise SystemExit("lane regression test block markers not found")
          replacement = """    [TestMethod]
              public void LegacyWideLanesRemainValidWhileAggregateOverflowIsRejected()
              {
                  var world = new SimulationWorld();
                  var startNode = world.CreateRoadNode(new WorldPoint(0d, 0d, 0d));
                  var endNode = world.CreateRoadNode(new WorldPoint(100d, 0d, 0d));
                  var segment = world.CreateRoadSegment(startNode, endNode);

                  world.CreateLane(segment, LaneDirection.Forward, 0, 30d, 10d);
                  world.CreateLane(segment, LaneDirection.Forward, 1, 250d, 10d);
                  var restored = SimulationWorld.RestoreCheckpoint(world.CreateCheckpoint());
                  Assert.AreEqual(2, restored.LaneCount);

                  var overflowWorld = new SimulationWorld();
                  var overflowStart = overflowWorld.CreateRoadNode(new WorldPoint(0d, 0d, 0d));
                  var overflowEnd = overflowWorld.CreateRoadNode(new WorldPoint(100d, 0d, 0d));
                  var overflowSegment = overflowWorld.CreateRoadSegment(overflowStart, overflowEnd);
                  overflowWorld.CreateLane(overflowSegment, LaneDirection.Forward, 0, double.MaxValue, 10d);

                  Assert.ThrowsExactly<ArgumentOutOfRangeException>(() =>
                      overflowWorld.CreateLane(overflowSegment, LaneDirection.Forward, 1, 1d, 10d));
                  Assert.AreEqual(1, overflowWorld.LaneCount);
              }

              [TestMethod]
              public void CheckpointRestoreRejectsAggregateLaneWidthOverflow()
              {
                  var world = new SimulationWorld();
                  var startNode = world.CreateRoadNode(new WorldPoint(0d, 0d, 0d));
                  var endNode = world.CreateRoadNode(new WorldPoint(100d, 0d, 0d));
                  var segment = world.CreateRoadSegment(startNode, endNode);
                  world.CreateLane(segment, LaneDirection.Forward, 0, 3.5d, 10d);
                  world.CreateLane(segment, LaneDirection.Forward, 1, 3.5d, 10d);
                  var checkpoint = world.CreateCheckpoint();
                  var lanes = checkpoint.Lanes.ToArray();
                  lanes[0] = lanes[0] with { WidthMeters = double.MaxValue };
                  lanes[1] = lanes[1] with { WidthMeters = 1d };

                  Assert.ThrowsExactly<ArgumentException>(() =>
                      SimulationWorld.RestoreCheckpoint(checkpoint with { Lanes = lanes }));
              }

"""
          Path(path).write_text(text[:start_index] + replacement + text[end_index:])
          PY

          git diff --check
          git status --short

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Worker1 review helper"
          git config user.email "noreply@github.com"
          git add \
            src/MachiVerseWorks.Simulation/Internal/RoadNetworkStore.cs \
            src/MachiVerseWorks.Simulation/SimulationWorld.Roads.cs \
            src/MachiVerseWorks.Simulation/Internal/LaneOccupancyIndex.cs \
            src/MachiVerseWorks.Simulation/Internal/VehicleStore.cs \
            docs/architecture/protocol.md \
            tests/MachiVerseWorks.Simulation.Tests/Worker1FinalBatchRegressionTests.cs
          git commit -m "fix: address worker1 review findings"
          git push origin HEAD:fix/all-open-issues-worker-1
