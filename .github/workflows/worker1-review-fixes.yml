name: Worker1 Review Fixes

on:
  push:
    branches:
      - fix/all-open-issues-worker-1
    paths:
      - .github/workflows/worker1-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply review fixes
        run: |
          python3 .github/scripts/worker1-review-fixes.py
          git diff --check
          git status --short

      - name: Commit review fixes
        run: |
          git config user.name "Worker1 review helper"
          git config user.email "noreply@github.com"
          git add src/MachiVerseWorks.Simulation/Internal/RoadNetworkStore.cs src/MachiVerseWorks.Simulation/SimulationWorld.Roads.cs src/MachiVerseWorks.Simulation/Internal/LaneOccupancyIndex.cs src/MachiVerseWorks.Simulation/Internal/VehicleStore.cs docs/architecture/protocol.md tests/MachiVerseWorks.Simulation.Tests/Worker1FinalBatchRegressionTests.cs
          git commit -m "fix: address worker1 review findings"
          git push origin HEAD:fix/all-open-issues-worker-1
