name: Worker1 Review Fixes

on:
  push:
    branches:
      - fix/all-open-issues-worker-1
    paths:
      - .github/workflows/worker1-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | python3

      - name: Build and test .NET
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore MachiVerseWorks.slnx
          dotnet build MachiVerseWorks.slnx --no-restore --configuration Release
          dotnet test MachiVerseWorks.slnx --no-build --configuration Release

      - name: Test web
        shell: bash
        working-directory: src/web
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Worker1 review helper"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "fix: address worker1 PR review findings"
          git push origin HEAD:fix/all-open-issues-worker-1
