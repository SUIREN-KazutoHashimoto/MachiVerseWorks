name: Worker 3 workflow proposal

on:
  push:
    branches:
      - fix/all-open-issues-worker-3
    paths:
      - '.github/workflows/worker3-batch2.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/all-open-issues-worker-3

      - name: Generate validated workflow proposals
        run: |
          python scripts/worker3-workflow-proposal.py
          git diff --check -- scripts/worker3-ci-proposed.yml scripts/worker3-e2e-proposed.yml

      - name: Commit proposal files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/worker3-ci-proposed.yml scripts/worker3-e2e-proposed.yml
          git commit -m 'chore: generate worker-3 workflow proposals'
          git push origin HEAD:fix/all-open-issues-worker-3
