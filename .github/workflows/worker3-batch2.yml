name: Worker 3 batch 2

on:
  push:
    branches:
      - fix/all-open-issues-worker-3
    paths:
      - '.github/workflows/worker3-batch2.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/all-open-issues-worker-3

      - name: Apply second batch fixes
        run: |
          sed -i 's/text\[finish:\]/text[finish + len(end):]/' scripts/worker3-batch2.py
          python scripts/worker3-batch2.py
          git diff --check
          git status --short

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Restore and build .NET
        run: |
          dotnet restore MachiVerseWorks.slnx
          dotnet build MachiVerseWorks.slnx --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test MachiVerseWorks.slnx --configuration Release --no-build

      - name: Install and test Web
        run: |
          npm --prefix src/web ci
          npm --prefix src/web run lint
          npm --prefix src/web run typecheck
          npm --prefix src/web test
          npm --prefix src/web run build

      - name: Smoke prepared E2E path
        env:
          MVW_E2E_PREPARED: '1'
        run: bash scripts/run-view-phase03-e2e.sh

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/worker3-batch2.yml scripts/worker3-batch2.py
          git diff --cached --check
          git commit -m 'fix: resolve worker-3 issues 246-304 batch 2'
          git push origin HEAD:fix/all-open-issues-worker-3
