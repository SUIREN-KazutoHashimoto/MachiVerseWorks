name: Worker1 Batch2 Patch

on:
  push:
    branches:
      - fix/all-open-issues-worker-1
    paths:
      - .github/workflows/worker1-batch2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-open-issues-worker-1
          fetch-depth: 0
      - name: Apply batch 2 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise RuntimeError(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:100]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          def replace_all(path, old, new, expected_min=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < expected_min:
                  raise RuntimeError(f"{path}: expected at least {expected_min} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          Path('src/MachiVerseWorks.Simulation/SimulationNumeric.cs').write_text('''namespace MachiVerseWorks.Simulation;\n\ninternal static class SimulationNumeric\n{\n    public static double SaturatingAddNonNegative(double left, double right)\n    {\n        ValidateNonNegativeFinite(left, nameof(left));\n        ValidateNonNegativeFinite(right, nameof(right));\n        return left > double.MaxValue - right ? double.MaxValue : left + right;\n    }\n\n    public static double SaturatingMultiplyNonNegative(double left, double right)\n    {\n        ValidateNonNegativeFinite(left, nameof(left));\n        ValidateNonNegativeFinite(right, nameof(right));\n        if (left == 0d || right == 0d) return 0d;\n        return left > double.MaxValue / right ? double.MaxValue : left * right;\n    }\n\n    public static double SaturatingMultiplyNonNegative(double first, double second, double third) =>\n        SaturatingMultiplyNonNegative(SaturatingMultiplyNonNegative(first, second), third);\n\n    public static double SaturatingMultiplyNonNegative(double first, double second, double third, double fourth) =>\n        SaturatingMultiplyNonNegative(SaturatingMultiplyNonNegative(first, second, third), fourth);\n\n    public static double SaturatingDoubleSum<T>(IEnumerable<T> source, Func<T, double> selector)\n    {\n        ArgumentNullException.ThrowIfNull(source);\n        ArgumentNullException.ThrowIfNull(selector);\n        var total = 0d;\n        foreach (var item in source) total = SaturatingAddNonNegative(total, selector(item));\n        return total;\n    }\n\n    public static long SaturatingLongSum<T>(IEnumerable<T> source, Func<T, long> selector)\n    {\n        ArgumentNullException.ThrowIfNull(source);\n        ArgumentNullException.ThrowIfNull(selector);\n        var total = 0L;\n        foreach (var item in source)\n        {\n            var value = selector(item);\n            if (value < 0) throw new InvalidOperationException("Saturating monetary aggregation requires non-negative values.");\n            if (total > long.MaxValue - value) return long.MaxValue;\n            total += value;\n        }\n        return total;\n    }\n\n    public static int SaturatingToInt32NonNegative(long value)\n    {\n        if (value < 0) throw new ArgumentOutOfRangeException(nameof(value));\n        return value >= int.MaxValue ? int.MaxValue : (int)value;\n    }\n\n    private static void ValidateNonNegativeFinite(double value, string name)\n    {\n        if (!double.IsFinite(value) || value < 0d)\n            throw new ArgumentOutOfRangeException(name, value, "Value must be finite and non-negative.");\n    }\n}\n''')

          # #208: fail-stop SimulationWorld after any partial Step failure.
          world = 'src/MachiVerseWorks.Simulation/SimulationWorld.cs'
          replace(world,
              '    private DeterministicRandom _random;\n',
              '    private DeterministicRandom _random;\n    private bool _isFaulted;\n')
          replace(world,
              '    public int TotalCreatedAgentCount => _agents.TotalCreatedCount;\n',
              '    public int TotalCreatedAgentCount => _agents.TotalCreatedCount;\n    public bool IsFaulted => _isFaulted;\n')
          replace(world, '''    public void Step()\n    {\n        var nextTime = Time.Advance(Config.TickRate);\n        _agents.Step(Config.TickDurationSeconds, _spatialIndex);\n        CapturePowerProductionBaselines();\n        StepPower(nextTime);\n        StepWaterSewerTransactional(nextTime);\n        StepGas(nextTime);\n        StepOptical(nextTime);\n        StepRadio(nextTime);\n        StepEconomy(nextTime);\n        ApplyPowerOperationalConstraints();\n        StepLogistics(nextTime);\n        StepPersistentRegionalEvolution(nextTime);\n        PlanPopulationAndEconomyTrips(nextTime);\n        StepVehicles(Config.TickDurationSeconds, nextTime.TickCount);\n        StepRailwayOperations(Config.TickDurationSeconds, nextTime.TickCount);\n        StepPedestrians(Config.TickDurationSeconds);\n        StepMultimodalTransit(nextTime.TickCount);\n        CompletePopulationTrips();\n        Time = nextTime;\n    }\n''', '''    public void Step()\n    {\n        if (_isFaulted)\n            throw new InvalidOperationException("Simulation world is faulted because a previous Step failed and cannot be stepped again.");\n\n        try\n        {\n            var nextTime = Time.Advance(Config.TickRate);\n            _agents.Step(Config.TickDurationSeconds, _spatialIndex);\n            CapturePowerProductionBaselines();\n            StepPower(nextTime);\n            StepWaterSewerTransactional(nextTime);\n            StepGas(nextTime);\n            StepOptical(nextTime);\n            StepRadio(nextTime);\n            StepEconomy(nextTime);\n            ApplyPowerOperationalConstraints();\n            StepLogistics(nextTime);\n            StepPersistentRegionalEvolution(nextTime);\n            PlanPopulationAndEconomyTrips(nextTime);\n            StepVehicles(Config.TickDurationSeconds, nextTime.TickCount);\n            StepRailwayOperations(Config.TickDurationSeconds, nextTime.TickCount);\n            StepPedestrians(Config.TickDurationSeconds);\n            StepMultimodalTransit(nextTime.TickCount);\n            CompletePopulationTrips();\n            Time = nextTime;\n        }\n        catch\n        {\n            _isFaulted = true;\n            throw;\n        }\n    }\n''')
          replace(world,
              '    public SimulationCheckpoint CreateCheckpoint()\n    {\n        EnsurePedestrianNetwork();\n',
              '    public SimulationCheckpoint CreateCheckpoint()\n    {\n        if (_isFaulted)\n            throw new InvalidOperationException("A faulted Simulation world cannot be checkpointed because its domain state may represent a partial tick.");\n        EnsurePedestrianNetwork();\n')

          # #210/#212/#213 Economy aggregate ranges and worker aggregation.
          economy = 'src/MachiVerseWorks.Simulation/SimulationWorld.Economy.cs'
          replace(economy, '        var vacantPositions = 0;\n', '        long vacantPositions = 0;\n')
          replace(economy, '            vacantPositions,\n', '            SimulationNumeric.SaturatingToInt32NonNegative(vacantPositions),\n')
          for old, new in [
              ('_economyHouseholds.Values.Sum(static item => item.CashBalance)', 'SimulationNumeric.SaturatingLongSum(_economyHouseholds.Values, static item => item.CashBalance)'),
              ('_economyHouseholds.Values.Sum(static item => item.Income)', 'SimulationNumeric.SaturatingLongSum(_economyHouseholds.Values, static item => item.Income)'),
              ('_economyHouseholds.Values.Sum(static item => item.Spending)', 'SimulationNumeric.SaturatingLongSum(_economyHouseholds.Values, static item => item.Spending)'),
              ('_economyCompanies.Sum(static item => item.CashBalance)', 'SimulationNumeric.SaturatingLongSum(_economyCompanies, static item => item.CashBalance)'),
              ('_economyCompanies.Sum(static item => item.Revenue)', 'SimulationNumeric.SaturatingLongSum(_economyCompanies, static item => item.Revenue)'),
              ('_economyCompanies.Sum(static item => item.Expense)', 'SimulationNumeric.SaturatingLongSum(_economyCompanies, static item => item.Expense)'),
              ('_economyCompanies.Sum(static item => item.ProducedUnits)', 'SimulationNumeric.SaturatingDoubleSum(_economyCompanies, static item => item.ProducedUnits)'),
          ]:
              replace(economy, old, new)
          replace(economy,
              '            var requiredWorkers = 0;\n            var filledWorkers = 0;\n',
              '            long requiredWorkers = 0;\n            long filledWorkers = 0;\n')
          replace(economy,
              '                requiredWorkers = checked(requiredWorkers + job.RequiredWorkerCount);\n                filledWorkers = checked(filledWorkers + GetFilledWorkerCount(job.Id));\n',
              '                requiredWorkers += job.RequiredWorkerCount;\n                filledWorkers += GetFilledWorkerCount(job.Id);\n')

          # #207/#211/#213 Power finite derivation, aggregates, worker sums.
          power = 'src/MachiVerseWorks.Simulation/SimulationWorld.Power.cs'
          for old, new in [
              ('_powerGenerators.Sum(static item => item.CapacityMegawatts)', 'SimulationNumeric.SaturatingDoubleSum(_powerGenerators, static item => item.CapacityMegawatts)'),
              ('_powerGenerators.Sum(static item => item.OutputMegawatts)', 'SimulationNumeric.SaturatingDoubleSum(_powerGenerators, static item => item.OutputMegawatts)'),
              ('_powerLoads.Sum(static item => item.DemandMegawatts)', 'SimulationNumeric.SaturatingDoubleSum(_powerLoads, static item => item.DemandMegawatts)'),
              ('_powerLoads.Sum(static item => item.ServedMegawatts)', 'SimulationNumeric.SaturatingDoubleSum(_powerLoads, static item => item.ServedMegawatts)'),
              ('_powerLoads.Sum(static item => item.UnservedMegawatts)', 'SimulationNumeric.SaturatingDoubleSum(_powerLoads, static item => item.UnservedMegawatts)'),
          ]:
              replace(power, old, new)
          replace(power, '''        foreach (var load in _powerLoads.OrderBy(static item => item.Id.Value))\n            load.DemandMegawatts = CalculatePowerDemand(load, nextTime);\n\n        var request = new PowerDispatchRequest(\n''', '''        var calculatedDemands = _powerLoads\n            .OrderBy(static item => item.Id.Value)\n            .Select(load => (Load: load, Demand: CalculatePowerDemand(load, nextTime)))\n            .ToArray();\n        foreach (var item in calculatedDemands) item.Load.DemandMegawatts = item.Demand;\n\n        var request = new PowerDispatchRequest(\n''')
          replace(power, '''                var required = jobs.Sum(static item => item.RequiredWorkerCount);\n                var filled = jobs.Sum(item => GetFilledWorkerCount(item.Id));\n                var utilization = required == 0 ? 0d : Math.Min(1d, (double)filled / required);\n''', '''                long required = 0;\n                long filled = 0;\n                foreach (var job in jobs)\n                {\n                    required += job.RequiredWorkerCount;\n                    filled += GetFilledWorkerCount(job.Id);\n                }\n                var utilization = required == 0 ? 0d : Math.Min(1d, (double)filled / required);\n''')
          replace(power,
              '        return load.BaseDemandMegawatts * timeFactor * useFactor * activityFactor;\n',
              '        return SimulationNumeric.SaturatingMultiplyNonNegative(load.BaseDemandMegawatts, timeFactor, useFactor, activityFactor);\n')
          replace(power,
              '        var demand = loads.Sum(static item => item.DemandMegawatts);\n        if (demand <= PowerDefaults.SupplyEpsilonMegawatts) return 1d;\n        return Math.Clamp(loads.Sum(static item => item.ServedMegawatts) / demand, 0d, 1d);\n',
              '        var demand = SimulationNumeric.SaturatingDoubleSum(loads, static item => item.DemandMegawatts);\n        if (demand <= PowerDefaults.SupplyEpsilonMegawatts) return 1d;\n        return Math.Clamp(SimulationNumeric.SaturatingDoubleSum(loads, static item => item.ServedMegawatts) / demand, 0d, 1d);\n')

          # #207/#211/#213 Water/Sewer finite derivation and safe aggregates.
          water = 'src/MachiVerseWorks.Simulation/SimulationWorld.WaterSewer.cs'
          replace(water,
              '_waterSources.Sum(static item => item.CapacityCubicMetersPerDay) + _reservoirs.Sum(static item => item.ReleaseCapacityCubicMetersPerDay)',
              'SimulationNumeric.SaturatingAddNonNegative(\n            SimulationNumeric.SaturatingDoubleSum(_waterSources, static item => item.CapacityCubicMetersPerDay),\n            SimulationNumeric.SaturatingDoubleSum(_reservoirs, static item => item.ReleaseCapacityCubicMetersPerDay))')
          for old, new in [
              ('_waterSewerServicePoints.Sum(static item => item.WaterDemandCubicMetersPerDay)', 'SimulationNumeric.SaturatingDoubleSum(_waterSewerServicePoints, static item => item.WaterDemandCubicMetersPerDay)'),
              ('_waterSewerServicePoints.Sum(static item => item.WaterServedCubicMetersPerDay)', 'SimulationNumeric.SaturatingDoubleSum(_waterSewerServicePoints, static item => item.WaterServedCubicMetersPerDay)'),
              ('_waterSewerServicePoints.Sum(static item => item.WastewaterGeneratedCubicMetersPerDay)', 'SimulationNumeric.SaturatingDoubleSum(_waterSewerServicePoints, static item => item.WastewaterGeneratedCubicMetersPerDay)'),
              ('_waterSewerServicePoints.Sum(static item => item.WastewaterProcessedCubicMetersPerDay)', 'SimulationNumeric.SaturatingDoubleSum(_waterSewerServicePoints, static item => item.WastewaterProcessedCubicMetersPerDay)'),
              ('_waterSewerServicePoints.Sum(static item => item.WastewaterOverflowCubicMetersPerDay)', 'SimulationNumeric.SaturatingDoubleSum(_waterSewerServicePoints, static item => item.WastewaterOverflowCubicMetersPerDay)'),
          ]:
              replace(water, old, new)
          replace(water, '''        var demandContext = CreateWaterDemandContext();\n        foreach (var point in _waterSewerServicePoints)\n            point.WaterDemandCubicMetersPerDay = CalculateWaterDemand(point, nextTime, demandContext);\n\n        var waterResult = _waterSupplySolver.Solve(new WaterSupplyRequest(\n''', '''        var demandContext = CreateWaterDemandContext();\n        var calculatedDemands = _waterSewerServicePoints\n            .Select(point => (Point: point, Demand: CalculateWaterDemand(point, nextTime, demandContext)))\n            .ToArray();\n        foreach (var item in calculatedDemands) item.Point.WaterDemandCubicMetersPerDay = item.Demand;\n\n        var waterResult = _waterSupplySolver.Solve(new WaterSupplyRequest(\n''')
          replace(water,
              '        var requiredWorkersByEstablishment = new Dictionary<EstablishmentId, int>();\n',
              '        var requiredWorkersByEstablishment = new Dictionary<EstablishmentId, long>();\n')
          replace(water, '''            requiredWorkersByEstablishment[job.EstablishmentId] = checked(\n                requiredWorkersByEstablishment.GetValueOrDefault(job.EstablishmentId) + job.RequiredWorkerCount);\n''', '''            requiredWorkersByEstablishment[job.EstablishmentId] =\n                requiredWorkersByEstablishment.GetValueOrDefault(job.EstablishmentId) + job.RequiredWorkerCount;\n''')
          replace(water,
              '        var filledWorkersByEstablishment = new Dictionary<EstablishmentId, int>();\n',
              '        var filledWorkersByEstablishment = new Dictionary<EstablishmentId, long>();\n')
          replace(water,
              '        return point.BaseWaterDemandCubicMetersPerDay * timeFactor * useFactor;\n',
              '        return SimulationNumeric.SaturatingMultiplyNonNegative(point.BaseWaterDemandCubicMetersPerDay, timeFactor, useFactor);\n')
          replace(water, '        var demand = direct.Sum(static item => item.WaterDemandCubicMetersPerDay);\n', '        var demand = SimulationNumeric.SaturatingDoubleSum(direct, static item => item.WaterDemandCubicMetersPerDay);\n')
          replace(water, '            : direct.Sum(static item => item.WaterServedCubicMetersPerDay) / demand;\n', '            : SimulationNumeric.SaturatingDoubleSum(direct, static item => item.WaterServedCubicMetersPerDay) / demand;\n')
          replace(water, '        var wastewater = direct.Sum(static item => item.WastewaterGeneratedCubicMetersPerDay);\n', '        var wastewater = SimulationNumeric.SaturatingDoubleSum(direct, static item => item.WastewaterGeneratedCubicMetersPerDay);\n')
          replace(water, '            : direct.Sum(static item => item.WastewaterProcessedCubicMetersPerDay) / wastewater;\n', '            : SimulationNumeric.SaturatingDoubleSum(direct, static item => item.WastewaterProcessedCubicMetersPerDay) / wastewater;\n')
          replace_all(water, 'IReadOnlyDictionary<EstablishmentId, int> RequiredWorkersByEstablishment', 'IReadOnlyDictionary<EstablishmentId, long> RequiredWorkersByEstablishment')
          replace_all(water, 'IReadOnlyDictionary<EstablishmentId, int> FilledWorkersByEstablishment', 'IReadOnlyDictionary<EstablishmentId, long> FilledWorkersByEstablishment')

          # #207/#211/#213 Gas finite derivation and safe aggregates.
          gas = 'src/MachiVerseWorks.Simulation/SimulationWorld.Gas.cs'
          replace(gas, '''        _gasSources.Where(static item => item.OperatingState == GasOperatingState.Online).Sum(static item => item.CapacityCubicMetersPerDay)\n            + _gasImportTerminals.Where(static item => item.OperatingState == GasOperatingState.Online).Sum(static item => item.CapacityCubicMetersPerDay)\n            + _gasStorages.Where(static item => item.OperatingState == GasOperatingState.Online).Sum(static item => Math.Min(item.ReleaseCapacityCubicMetersPerDay, item.StoredCubicMeters * EconomyDefaults.TicksPerEconomicDay)),\n        _gasServicePoints.Sum(static item => item.DemandCubicMetersPerDay),\n        _gasServicePoints.Sum(static item => item.ServedCubicMetersPerDay),\n        _gasServicePoints.Sum(static item => item.UnservedCubicMetersPerDay),\n        _gasStorages.Sum(static item => item.StoredCubicMeters),\n''', '''        SimulationNumeric.SaturatingAddNonNegative(\n            SimulationNumeric.SaturatingAddNonNegative(\n                SimulationNumeric.SaturatingDoubleSum(_gasSources.Where(static item => item.OperatingState == GasOperatingState.Online), static item => item.CapacityCubicMetersPerDay),\n                SimulationNumeric.SaturatingDoubleSum(_gasImportTerminals.Where(static item => item.OperatingState == GasOperatingState.Online), static item => item.CapacityCubicMetersPerDay)),\n            SimulationNumeric.SaturatingDoubleSum(_gasStorages.Where(static item => item.OperatingState == GasOperatingState.Online), static item =>\n                Math.Min(item.ReleaseCapacityCubicMetersPerDay, SimulationNumeric.SaturatingMultiplyNonNegative(item.StoredCubicMeters, (double)EconomyDefaults.TicksPerEconomicDay)))),\n        SimulationNumeric.SaturatingDoubleSum(_gasServicePoints, static item => item.DemandCubicMetersPerDay),\n        SimulationNumeric.SaturatingDoubleSum(_gasServicePoints, static item => item.ServedCubicMetersPerDay),\n        SimulationNumeric.SaturatingDoubleSum(_gasServicePoints, static item => item.UnservedCubicMetersPerDay),\n        SimulationNumeric.SaturatingDoubleSum(_gasStorages, static item => item.StoredCubicMeters),\n''')
          replace(gas, '''        var demandContext = CreateGasDemandContext();\n        foreach (var point in _gasServicePoints)\n            point.DemandCubicMetersPerDay = CalculateGasDemand(point, nextTime, demandContext);\n\n        var request = new GasSupplyRequest(\n''', '''        var demandContext = CreateGasDemandContext();\n        var calculatedDemands = _gasServicePoints\n            .Select(point => (Point: point, Demand: CalculateGasDemand(point, nextTime, demandContext)))\n            .ToArray();\n        foreach (var item in calculatedDemands) item.Point.DemandCubicMetersPerDay = item.Demand;\n\n        var request = new GasSupplyRequest(\n''')
          replace(gas,
              'item.OperatingState == GasOperatingState.Online ? Math.Min(item.ReleaseCapacityCubicMetersPerDay, item.StoredCubicMeters * EconomyDefaults.TicksPerEconomicDay) : 0d',
              'item.OperatingState == GasOperatingState.Online ? Math.Min(item.ReleaseCapacityCubicMetersPerDay, SimulationNumeric.SaturatingMultiplyNonNegative(item.StoredCubicMeters, (double)EconomyDefaults.TicksPerEconomicDay)) : 0d')
          replace(gas,
              '        var requiredWorkersByEstablishment = new Dictionary<EstablishmentId, int>();\n',
              '        var requiredWorkersByEstablishment = new Dictionary<EstablishmentId, long>();\n')
          replace(gas,
              '            requiredWorkersByEstablishment[job.EstablishmentId] = checked(requiredWorkersByEstablishment.GetValueOrDefault(job.EstablishmentId) + job.RequiredWorkerCount);\n',
              '            requiredWorkersByEstablishment[job.EstablishmentId] = requiredWorkersByEstablishment.GetValueOrDefault(job.EstablishmentId) + job.RequiredWorkerCount;\n')
          replace(gas,
              '        var filledWorkersByEstablishment = new Dictionary<EstablishmentId, int>();\n',
              '        var filledWorkersByEstablishment = new Dictionary<EstablishmentId, long>();\n')
          replace(gas,
              '        return point.BaseDemandCubicMetersPerDay * timeFactor * useFactor;\n',
              '        return SimulationNumeric.SaturatingMultiplyNonNegative(point.BaseDemandCubicMetersPerDay, timeFactor, useFactor);\n')
          replace(gas,
              '        var demand = points.Sum(static item => item.DemandCubicMetersPerDay);\n        return demand <= GasDefaults.FlowEpsilonCubicMetersPerDay ? 1d : Math.Clamp(points.Sum(static item => item.ServedCubicMetersPerDay) / demand, 0d, 1d);\n',
              '        var demand = SimulationNumeric.SaturatingDoubleSum(points, static item => item.DemandCubicMetersPerDay);\n        return demand <= GasDefaults.FlowEpsilonCubicMetersPerDay ? 1d : Math.Clamp(SimulationNumeric.SaturatingDoubleSum(points, static item => item.ServedCubicMetersPerDay) / demand, 0d, 1d);\n')
          replace_all(gas, 'IReadOnlyDictionary<EstablishmentId, int> RequiredWorkersByEstablishment', 'IReadOnlyDictionary<EstablishmentId, long> RequiredWorkersByEstablishment')
          replace_all(gas, 'IReadOnlyDictionary<EstablishmentId, int> FilledWorkersByEstablishment', 'IReadOnlyDictionary<EstablishmentId, long> FilledWorkersByEstablishment')

          # #207/#211 Optical finite derivation and aggregates.
          optical = 'src/MachiVerseWorks.Simulation/SimulationWorld.Optical.cs'
          replace(optical, '        var allocated = _opticalDemands.Sum(static item => item.AllocatedGigabitsPerSecond);\n', '        var allocated = SimulationNumeric.SaturatingDoubleSum(_opticalDemands, static item => item.AllocatedGigabitsPerSecond);\n')
          replace(optical, '_opticalBackhauls.Where(static item => item.IsInService).Sum(static item => item.CapacityGigabitsPerSecond)', 'SimulationNumeric.SaturatingDoubleSum(_opticalBackhauls.Where(static item => item.IsInService), static item => item.CapacityGigabitsPerSecond)')
          replace(optical, '_opticalDemands.Sum(static item => item.DemandGigabitsPerSecond)', 'SimulationNumeric.SaturatingDoubleSum(_opticalDemands, static item => item.DemandGigabitsPerSecond)')
          replace(optical, '''        foreach (var equipment in _opticalEquipment)\n            equipment.IsPowered = IsOpticalEquipmentPowered(equipment);\n        foreach (var demand in _opticalDemands)\n            demand.DemandGigabitsPerSecond = CalculateOpticalDemand(demand, nextTime);\n\n        var equipmentByNode = _opticalEquipment\n''', '''        var calculatedDemands = _opticalDemands\n            .Select(demand => (DemandState: demand, Value: CalculateOpticalDemand(demand, nextTime)))\n            .ToArray();\n        foreach (var equipment in _opticalEquipment)\n            equipment.IsPowered = IsOpticalEquipmentPowered(equipment);\n        foreach (var item in calculatedDemands) item.DemandState.DemandGigabitsPerSecond = item.Value;\n\n        var equipmentByNode = _opticalEquipment\n''')
          replace(optical, '''        return equipment\n            .Where(static item => item.IsInService && item.IsPowered && IsEndpointEquipment(item.Kind))\n            .Sum(static item => item.CapacityGigabitsPerSecond);\n''', '''        return SimulationNumeric.SaturatingDoubleSum(\n            equipment.Where(static item => item.IsInService && item.IsPowered && IsEndpointEquipment(item.Kind)),\n            static item => item.CapacityGigabitsPerSecond);\n''')
          replace(optical, '''        return equipment\n            .Where(static item => item.IsInService && item.IsPowered && IsBackhaulEquipment(item.Kind))\n            .Sum(static item => item.CapacityGigabitsPerSecond);\n''', '''        return SimulationNumeric.SaturatingDoubleSum(\n            equipment.Where(static item => item.IsInService && item.IsPowered && IsBackhaulEquipment(item.Kind)),\n            static item => item.CapacityGigabitsPerSecond);\n''')
          replace(optical,
              '        return demand.BaseDemandGigabitsPerSecond * timeFactor * useFactor;\n',
              '        return SimulationNumeric.SaturatingMultiplyNonNegative(demand.BaseDemandGigabitsPerSecond, timeFactor, useFactor);\n')

          # #237/#238/#239/#241 Multimodal state machine, allocator atomicity and ownership.
          store = 'src/MachiVerseWorks.Simulation/Internal/MultimodalTransitStore.cs'
          replace(store, '''        EnsureCapacity(nextVehicleId, "Transit vehicle");\n        var id = new TransitVehicleId(nextVehicleId++);\n        var first = stops[pattern.Stops[0].StopId];\n        vehicles.Add(id, new TransitVehicleState(id, TransitVehicleKind.Bus, tripId, first.Position)\n        {\n            State = TransitVehicleMovementState.AwaitingDeparture,\n            EstimatedArrivalTick = trip.PlannedStartTick,\n            DwellUntilTick = checked(trip.PlannedStartTick + pattern.Stops[0].DwellTicks),\n        });\n''', '''        var first = stops[pattern.Stops[0].StopId];\n        var dwellUntilTick = checked(trip.PlannedStartTick + pattern.Stops[0].DwellTicks);\n        EnsureCapacity(nextVehicleId, "Transit vehicle");\n        var id = new TransitVehicleId(nextVehicleId++);\n        vehicles.Add(id, new TransitVehicleState(id, TransitVehicleKind.Bus, tripId, first.Position)\n        {\n            State = TransitVehicleMovementState.AwaitingDeparture,\n            EstimatedArrivalTick = trip.PlannedStartTick,\n            DwellUntilTick = dwellUntilTick,\n        });\n''')
          replace(store, '''        EnsureCapacity(nextJourneyId, "Journey");\n        var id = new JourneyId(nextJourneyId++);\n        journeys.Add(id, new JourneySnapshot(id, tripRequestId, departureTick, checked(departureTick + total), Array.AsReadOnly(copied)));\n''', '''        var estimatedArrivalTick = checked(departureTick + total);\n        EnsureCapacity(nextJourneyId, "Journey");\n        var id = new JourneyId(nextJourneyId++);\n        journeys.Add(id, new JourneySnapshot(id, tripRequestId, departureTick, estimatedArrivalTick, Array.AsReadOnly(copied)));\n''')
          replace(store,
              '    public bool TryGetVehicle(TransitVehicleId id, out TransitVehicleState state) => vehicles.TryGetValue(id, out state!);\n',
              '    public bool TryGetVehicle(TransitVehicleId id, out TransitVehicleState state) => vehicles.TryGetValue(id, out state!);\n    public bool ContainsRoadVehicleReference(VehicleId id) => vehicles.Values.Any(item => item.RoadVehicleId == id);\n    public bool ContainsLaneReference(LaneId id) => stops.Values.Any(item => item.LaneId == id);\n')
