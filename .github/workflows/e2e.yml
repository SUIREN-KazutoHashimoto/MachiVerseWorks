name: End-to-end

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'docs/development/baselines/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'MachiVerseWorks.slnx'
      - 'global.json'
      - '.github/workflows/e2e.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare shared build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Build shared E2E inputs
        run: source scripts/prepare-e2e.sh
      - name: Pack shared E2E inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          printf '%s\n' "$GITHUB_SHA" > .e2e-prepared-commit
          tar -cf .artifacts/e2e-prepared.tar .e2e-prepared-commit src/*/bin src/*/obj src/web/node_modules src/web/dist
      - name: Upload shared E2E inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-prepared-${{ github.sha }}
          path: .artifacts/e2e-prepared.tar
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core-poc
            name: core-server-browser
            script: scripts/run-phase6-e2e.sh
            artifacts: .artifacts/phase6-e2e
            timeout: 25
          - id: road-network
            name: road-network-server-browser
            script: scripts/run-phase11-e2e.sh
            artifacts: .artifacts/phase11-e2e
            timeout: 15
          - id: road-traffic
            name: road-traffic-server-browser
            script: scripts/run-phase13-e2e.sh
            artifacts: .artifacts/phase13-e2e
            timeout: 15
          - id: signal-traffic
            name: signal-traffic-server-browser
            script: scripts/run-phase14-e2e.sh
            artifacts: .artifacts/phase14-e2e
            timeout: 15
          - id: population
            name: population-server-browser
            script: scripts/run-phase15-e2e.sh
            artifacts: .artifacts/phase15-e2e
            timeout: 15
          - id: pedestrian
            name: building-to-building-pedestrian
            script: scripts/run-phase16-e2e.sh
            artifacts: .artifacts/phase16-e2e
            timeout: 15
          - id: railway
            name: save-server-browser-railway
            script: scripts/run-phase17-e2e.sh
            artifacts: .artifacts/phase17-e2e
            timeout: 15
          - id: railway-operations
            name: railway-operations-server-browser
            script: scripts/run-phase18-e2e.sh
            artifacts: .artifacts/phase18-e2e
            timeout: 15
          - id: multimodal-transit
            name: multimodal-transit-server-browser
            script: scripts/run-phase19-e2e.sh
            artifacts: .artifacts/phase19-e2e
            timeout: 15
          - id: administration-console
            name: administration-console-server-browser
            script: scripts/run-phase20-e2e.sh
            artifacts: .artifacts/phase20-e2e
            timeout: 15
          - id: economy
            name: economy-employment-server-browser
            script: scripts/run-phase21-e2e.sh
            artifacts: .artifacts/phase21-e2e
            timeout: 15
          - id: logistics
            name: logistics-freight-server-browser
            script: scripts/run-phase22-e2e.sh
            artifacts: .artifacts/phase22-e2e
            timeout: 15
          - id: power
            name: power-outage-server-browser
            script: scripts/run-phase23-e2e.sh
            artifacts: .artifacts/phase23-e2e
            timeout: 15
          - id: water-sewer
            name: water-sewer-outage-server-browser
            script: scripts/run-phase24-e2e.sh
            artifacts: .artifacts/phase24-e2e
            timeout: 15
          - id: gas
            name: gas-pipeline-delivery-server-browser
            script: scripts/run-phase25-e2e.sh
            artifacts: .artifacts/phase25-e2e
            timeout: 15
          - id: optical
            name: optical-reroute-outage-server-browser
            script: scripts/run-phase26-e2e.sh
            artifacts: .artifacts/phase26-e2e
            timeout: 15
          - id: remote-mcp
            name: remote-mcp-administration
            script: scripts/run-phase27-e2e.sh
            artifacts: .artifacts/phase27-e2e
            timeout: 15
          - id: radio-spectrum
            name: radio-spectrum-server-browser
            script: scripts/run-phase28-e2e.sh
            artifacts: .artifacts/phase28-e2e
            timeout: 15
          - id: world-environment
            name: world-environment-restart-reproducibility
            script: scripts/run-phase29-e2e.sh
            artifacts: .artifacts/phase29-e2e
            timeout: 20
          - id: view-physical-world
            name: view-physical-world-rendering
            script: scripts/run-view-phase03-e2e.sh
            artifacts: .artifacts/view-phase03-e2e
            timeout: 20
          - id: view-settlement-structure
            name: view-settlement-structure-rendering
            script: scripts/run-view-phase04-e2e.sh
            artifacts: .artifacts/view-phase04-e2e
            timeout: 15
          - id: view-settlement-structure-live
            name: view-settlement-structure-live-delivery
            script: scripts/run-view-phase04-live-e2e.sh
            artifacts: .artifacts/view-phase04-live-e2e
            timeout: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Download shared E2E inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-prepared-${{ github.sha }}
          path: .artifacts/prepared
      - name: Restore shared E2E inputs
        shell: bash
        run: |
          set -euo pipefail
          tar -xf .artifacts/prepared/e2e-prepared.tar
          test "$(cat .e2e-prepared-commit)" = "$GITHUB_SHA"
      - name: Run end-to-end
        env:
          MVW_E2E_PREPARED: '1'
        run: bash "${{ matrix.script }}"
      - name: Upload end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-${{ matrix.id }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 7
