name: End-to-end

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: select affected e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select E2E matrix
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            selection="$(python scripts/select-ci-matrix.py e2e --base "$BASE_SHA" --head "$HEAD_SHA")"
          else
            selection="$(python scripts/select-ci-matrix.py e2e --full)"
          fi
          echo "matrix=$(jq -c '.matrix' <<< "$selection")" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reason' <<< "$selection")" >> "$GITHUB_OUTPUT"
          jq -r '.matrix.include[].name' <<< "$selection"

  prepare:
    name: prepare shared build
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Build shared E2E inputs
        run: source scripts/prepare-e2e.sh
      - name: Pack shared E2E inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          printf '%s\n' "$GITHUB_SHA" > .e2e-prepared-commit
          tar -cf .artifacts/e2e-prepared.tar .e2e-prepared-commit src/*/bin src/*/obj src/web/node_modules src/web/dist
      - name: Upload shared E2E inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-prepared-${{ github.sha }}
          path: .artifacts/e2e-prepared.tar
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: ${{ matrix.name }}
    needs: [select, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Download shared E2E inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-prepared-${{ github.sha }}
          path: .artifacts/prepared
      - name: Restore shared E2E inputs
        shell: bash
        run: |
          set -euo pipefail
          tar -xf .artifacts/prepared/e2e-prepared.tar
          test "$(cat .e2e-prepared-commit)" = "$GITHUB_SHA"
      - name: Install pinned visual browser
        if: matrix.id == 'view-physical-world' || matrix.id == 'view-settlement-structure'
        shell: bash
        env:
          MVW_VISUAL_BROWSER_VERSION: '152.0.7977.75'
        run: |
          set -euo pipefail
          browser="$(bash scripts/install-visual-browser.sh "$RUNNER_TEMP/machiverseworks-visual-browser")"
          echo "MVW_VISUAL_BROWSER=$browser" >> "$GITHUB_ENV"
          echo "MVW_VISUAL_BROWSER_VERSION=$MVW_VISUAL_BROWSER_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned visual font
        if: matrix.id == 'view-physical-world' || matrix.id == 'view-settlement-structure'
        shell: bash
        env:
          MVW_VISUAL_FONT_PACKAGE_VERSION: '2.37-8'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "fonts-dejavu-core=$MVW_VISUAL_FONT_PACKAGE_VERSION"
          test "$(dpkg-query -W -f='${Version}' fonts-dejavu-core)" = "$MVW_VISUAL_FONT_PACKAGE_VERSION"
          mkdir -p "$HOME/.config/fontconfig"
          cat > "$HOME/.config/fontconfig/fonts.conf" <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>sans-serif</family>
              <prefer><family>DejaVu Sans</family></prefer>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f
          test "$(fc-match -f '%{family}\n' sans-serif | head -n 1 | cut -d, -f1)" = 'DejaVu Sans'
          fc-match sans-serif
          echo "MVW_VISUAL_FONT_FAMILY=DejaVu Sans" >> "$GITHUB_ENV"
          echo "MVW_VISUAL_FONT_PACKAGE_VERSION=$MVW_VISUAL_FONT_PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Run end-to-end
        env:
          MVW_E2E_PREPARED: '1'
        run: bash "${{ matrix.script }}"
      - name: Upload end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-${{ matrix.id }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 7
