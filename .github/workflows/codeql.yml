name: CodeQL

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'
      - 'benchmarks/**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - 'src/web/**/*.js'
      - 'src/web/**/*.jsx'
      - 'src/web/**/*.ts'
      - 'src/web/**/*.tsx'
      - 'src/web/package.json'
      - 'src/web/package-lock.json'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'
      - 'benchmarks/**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - 'src/web/**/*.js'
      - 'src/web/**/*.jsx'
      - 'src/web/**/*.ts'
      - 'src/web/**/*.tsx'
      - 'src/web/package.json'
      - 'src/web/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      csharp: ${{ steps.detect.outputs.csharp }}
      javascript: ${{ steps.detect.outputs.javascript }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect source languages
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if find src tests benchmarks -type f -name '*.cs' -print -quit 2>/dev/null | grep -q .; then
            echo "csharp=true" >> "$GITHUB_OUTPUT"
          else
            echo "csharp=false" >> "$GITHUB_OUTPUT"
          fi

          if find src/web -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print -quit 2>/dev/null | grep -q .; then
            echo "javascript=true" >> "$GITHUB_OUTPUT"
          else
            echo "javascript=false" >> "$GITHUB_OUTPUT"
          fi

  csharp:
    name: csharp
    needs: detect
    if: needs.detect.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  javascript-typescript:
    name: javascript-typescript
    needs: detect
    if: needs.detect.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4
