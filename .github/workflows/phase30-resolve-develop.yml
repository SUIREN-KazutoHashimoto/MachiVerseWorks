name: Phase30 Resolve Develop Integration

# Phase30 closeout integration trigger.
on:
  push:
    branches: [feature/simulation-phase30]
    paths:
      - '.github/workflows/phase30-resolve-develop.yml'

permissions:
  contents: write

jobs:
  merge-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Phase30
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/simulation-phase30
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Merge latest develop and resolve protocol dispatch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin develop

          set +e
          git merge --no-commit --no-ff origin/develop
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Merge conflicts:\n%s\n' "${conflicts[*]}"
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != 'src/MachiVerseWorks.Server/ClientConnections.cs' ]]; then
              echo 'Unexpected merge conflict set.' >&2
              exit 1
            fi

            # develop centralized protocol-version dispatch in ObservationProtocolAdapter.
            # Keep that architecture and add the Phase30 regional codec to the adapter.
            git checkout --theirs src/MachiVerseWorks.Server/ClientConnections.cs
            git add src/MachiVerseWorks.Server/ClientConnections.cs
          fi

          adapter_file=$(grep -RIl --include='*.cs' 'class ObservationProtocolAdapter\|static class ObservationProtocolAdapter' src | head -n 1 || true)
          if [[ -z "$adapter_file" ]]; then
            echo 'ObservationProtocolAdapter definition was not found.' >&2
            grep -RIn --include='*.cs' 'ObservationProtocolAdapter' src || true
            exit 1
          fi
          echo "Protocol adapter: $adapter_file"

          ADAPTER_FILE="$adapter_file" python - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ['ADAPTER_FILE'])
          text = path.read_text(encoding='utf-8')
          if 'RegionalGenerationSnapshotMessage regionalGeneration' not in text:
              needles = [
                  '            WorldEnvironmentSnapshotMessage worldEnvironment => WorldEnvironmentProtocolCodec.Serialize(worldEnvironment, version),\n',
                  '                WorldEnvironmentSnapshotMessage worldEnvironment => WorldEnvironmentProtocolCodec.Serialize(worldEnvironment, version),\n',
              ]
              for needle in needles:
                  if needle in text:
                      indent = needle[:len(needle) - len(needle.lstrip())]
                      replacement = needle + indent + 'RegionalGenerationSnapshotMessage regionalGeneration => RegionalGenerationProtocolCodec.Serialize(regionalGeneration, version),\n'
                      text = text.replace(needle, replacement, 1)
                      break
              else:
                  raise SystemExit('WorldEnvironment protocol dispatch arm was not found in ObservationProtocolAdapter.')
              path.write_text(text, encoding='utf-8')
          PY
          git add "$adapter_file"

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'Unresolved merge conflicts remain:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          rm -f .github/workflows/phase30-sync-develop.yml
          rm -f .github/workflows/phase30-resolve-develop.yml
          git add -A

          if ! git diff --cached --quiet origin/develop -- VERSION; then
            echo 'Phase30 must not carry a VERSION delta against latest develop.' >&2
            git diff --cached origin/develop -- VERSION >&2
            exit 1
          fi

      - name: Restore merged tree
        run: dotnet restore MachiVerseWorks.slnx

      - name: Build merged tree
        run: dotnet build MachiVerseWorks.slnx --configuration Release --no-restore

      - name: Test merged tree
        run: dotnet test MachiVerseWorks.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Run Phase30 benchmark
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/regional-generation
        run: >-
          dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj
          --configuration Release --no-restore --
          --filter '*RegionalGenerationBenchmarks*' --job short

      - name: Phase30 integration invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached origin/develop --check
          test "$(grep -c -- '- ✅ \*\*P30-' roadmap/SIMULATION_ROADMAP.md)" -eq 35
          test "$(grep -c -- '- ⬜ \*\*P30-' roadmap/SIMULATION_ROADMAP.md)" -eq 0
          test ! -e .github/workflows/phase30-sync-develop.yml
          test ! -e .github/workflows/phase30-resolve-develop.yml
          test ! -e phase30-closeout-diagnostic.txt
          grep -RIl --include='*.cs' 'RegionalGenerationSnapshotMessage regionalGeneration => RegionalGenerationProtocolCodec.Serialize(regionalGeneration, version)' src >/dev/null

      - name: Commit and push validated develop merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Merge branch 'develop' into feature/simulation-phase30"
          git push origin HEAD:feature/simulation-phase30
