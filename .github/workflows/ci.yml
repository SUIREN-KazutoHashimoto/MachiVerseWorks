name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
      - 'docs/**'
      - 'refactor/**'
      - 'experiment/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required repository files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            AGENT.md
            AGENTS.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.txt
            .gitignore
            .gitattributes
            .editorconfig
            global.json
            Directory.Build.props
            Directory.Packages.props
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required repository file is missing or empty."
              exit 1
            fi
          done

          grep -Fq "AGENT.md" AGENTS.md
          grep -Fq "MachiVerseWorks" NOTICE

      - name: Validate .NET SDK policy
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          data = json.loads(Path("global.json").read_text(encoding="utf-8"))
          sdk = data.get("sdk")
          if not isinstance(sdk, dict):
              raise SystemExit("global.json must contain an sdk object")

          version = sdk.get("version")
          if not isinstance(version, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("sdk.version must be a fully-qualified stable SDK version")

          if sdk.get("allowPrerelease") is not False:
              raise SystemExit("sdk.allowPrerelease must be false")

          if sdk.get("rollForward") != "latestFeature":
              raise SystemExit("sdk.rollForward must be latestFeature")

          print(f".NET SDK baseline: {version}")

      - name: Validate locale manifest
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          path = Path("src/web/locales/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          default = data.get("defaultLocale")
          supported = data.get("supportedLocales")

          if not isinstance(default, str) or not default:
              raise SystemExit("defaultLocale must be a non-empty string")
          if not isinstance(supported, list) or not supported:
              raise SystemExit("supportedLocales must be a non-empty array")
          if default not in supported:
              raise SystemExit("defaultLocale must be included in supportedLocales")
          if len(supported) != len(set(supported)):
              raise SystemExit("supportedLocales contains duplicate locale tags")

          locale_pattern = re.compile(r"^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$")
          invalid = [locale for locale in supported if not isinstance(locale, str) or not locale_pattern.fullmatch(locale)]
          if invalid:
              raise SystemExit(f"Invalid locale tag(s): {invalid}")

          print(f"Default locale: {default}")
          print(f"Supported locales: {', '.join(supported)}")

  detect:
    name: detect components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.detect.outputs.dotnet }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect implemented components
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if find src tests benchmarks -type f -name '*.csproj' -print -quit 2>/dev/null | grep -q .; then
            echo "dotnet=true" >> "$GITHUB_OUTPUT"
          else
            echo "dotnet=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f src/web/package.json ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  dotnet:
    name: dotnet
    needs: [repository, detect]
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve solution
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f MachiVerseWorks.slnx ]]; then
            echo "DOTNET_TARGET=MachiVerseWorks.slnx" >> "$GITHUB_ENV"
          elif [[ -f MachiVerseWorks.sln ]]; then
            echo "DOTNET_TARGET=MachiVerseWorks.sln" >> "$GITHUB_ENV"
          else
            echo "::error::A .NET project exists, but MachiVerseWorks.slnx or MachiVerseWorks.sln is missing."
            exit 1
          fi

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore "$DOTNET_TARGET"

      - name: Build
        run: dotnet build "$DOTNET_TARGET" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$DOTNET_TARGET" --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ always() && hashFiles('TestResults/**/*.trx') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults/**/*.trx
          retention-days: 7

  web:
    name: web
    needs: [repository, detect]
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require npm lockfile
        shell: bash
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo "::error::src/web/package.json exists, but package-lock.json is missing."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Upload web build
        if: ${{ hashFiles('src/web/dist/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: src/web/dist
          retention-days: 7
