name: Phase 14 Intersection Benchmark

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'perf/**'
    paths:
      - 'src/MachiVerseWorks.Simulation/**'
      - 'benchmarks/MachiVerseWorks.Benchmarks/IntersectionControlBenchmarks.cs'
      - '.github/workflows/phase14-benchmark.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'src/MachiVerseWorks.Simulation/**'
      - 'benchmarks/MachiVerseWorks.Benchmarks/IntersectionControlBenchmarks.cs'
      - '.github/workflows/phase14-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase14-intersection-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: queued-intersections
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Run Intersection Control benchmarks
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/phase14-intersection-benchmark
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore -- --filter '*IntersectionControlBenchmarks*' --job short
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase14-intersection-benchmark
          path: .artifacts/phase14-intersection-benchmark
          if-no-files-found: warn
          retention-days: 14
