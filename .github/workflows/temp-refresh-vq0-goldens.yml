name: Temporary VQ-0 Golden Refresh

on:
  push:
    branches:
      - feat/view-vq0-user-facing-golden

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/view-vq0-user-facing-golden
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/view/.node-version
          cache: npm
          cache-dependency-path: src/view/package-lock.json
      - name: Prepare E2E inputs
        shell: bash
        run: source scripts/prepare-e2e.sh
      - name: Install pinned visual browser
        shell: bash
        env:
          MVW_VISUAL_BROWSER_VERSION: '152.0.7977.75'
        run: |
          set -euo pipefail
          browser="$(bash scripts/install-visual-browser.sh "$RUNNER_TEMP/machiverseworks-visual-browser")"
          echo "MVW_VISUAL_BROWSER=$browser" >> "$GITHUB_ENV"
          echo "MVW_VISUAL_BROWSER_VERSION=$MVW_VISUAL_BROWSER_VERSION" >> "$GITHUB_ENV"
      - name: Install pinned Japanese visual font
        shell: bash
        env:
          MVW_VISUAL_FONT_PACKAGE_VERSION: '1:20230817+repack1-3'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "fonts-noto-cjk=$MVW_VISUAL_FONT_PACKAGE_VERSION"
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = "$MVW_VISUAL_FONT_PACKAGE_VERSION"
          mkdir -p "$HOME/.config/fontconfig"
          cat > "$HOME/.config/fontconfig/fonts.conf" <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>sans-serif</family>
              <prefer><family>Noto Sans CJK JP</family></prefer>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f
          test "$(fc-match -f '%{family}\n' sans-serif | head -n 1 | cut -d, -f1)" = 'Noto Sans CJK JP'
          echo "MVW_VISUAL_FONT_FAMILY=Noto Sans CJK JP" >> "$GITHUB_ENV"
          echo "MVW_VISUAL_FONT_PACKAGE_VERSION=$MVW_VISUAL_FONT_PACKAGE_VERSION" >> "$GITHUB_ENV"
      - name: Regenerate reviewed VQ-0 Goldens
        shell: bash
        env:
          MVW_E2E_PREPARED: '1'
          MVW_UPDATE_USER_FACING_GOLDEN: '1'
        run: bash scripts/run-view-phase03-e2e.sh
      - name: Commit refreshed Goldens
        shell: bash
        run: |
          set -euo pipefail
          git add src/view/tests/visual/user-facing-golden/*.png
          if git diff --cached --quiet; then
            echo 'No Golden changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(view): refresh VQ-0 user-facing goldens'
          git push origin HEAD:feat/view-vq0-user-facing-golden
