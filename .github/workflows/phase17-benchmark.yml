name: Phase 17 Railway Benchmark

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'perf/**'
    paths:
      - 'src/MachiVerseWorks.Simulation/**'
      - 'benchmarks/**'
      - '.github/workflows/phase17-benchmark.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'src/MachiVerseWorks.Simulation/**'
      - 'benchmarks/**'
      - '.github/workflows/phase17-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: railway-10k-100k
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Run railway benchmarks
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/phase17-benchmark
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore -- --filter '*RailwayInfrastructureBenchmarks*' --job short
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase17-railway-benchmark
          path: .artifacts/phase17-benchmark
          if-no-files-found: warn
          retention-days: 14
