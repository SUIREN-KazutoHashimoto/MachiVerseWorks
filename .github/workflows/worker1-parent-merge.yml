name: Worker1 Parent Merge

on:
  push:
    branches:
      - fix/all-open-issues-worker-1
    paths:
      - .github/workflows/worker1-parent-merge.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Merge parent and resolve Optical conflict
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/all-open-issues
          git config user.name "Worker1 merge helper"
          git config user.email "noreply@github.com"
          git merge --no-commit --no-ff origin/fix/all-open-issues || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          expected="src/MachiVerseWorks.Simulation/SimulationWorld.Optical.cs"
          if [ "$conflicts" != "$expected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          git checkout --ours -- "$expected"
          echo '' | base64 -d | python3
          git add "$expected"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git status --short
          git commit -m "merge: sync fix/all-open-issues into worker1"
          git push origin HEAD:fix/all-open-issues-worker-1
