name: Worker1 Batch3 Compile Fix

on:
  push:
    branches:
      - fix/all-open-issues-worker-1
    paths:
      - .github/workflows/worker1-batch3-compile-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-open-issues-worker-1
      - name: Fix local name collision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/MachiVerseWorks.Simulation/SimulationWorld.MultimodalTransit.cs')
          text = p.read_text()
          old = '''                    var roadVehicleId = CreateVehicle(route, new VehicleDimensions(12d, 2.55d, 3.2d), new VehiclePerformance(22.2222222222d, 1.2d, 3d, 2.5d, 2d));\n                    vehicle.RoadVehicleId = roadVehicleId;'''
          new = '''                    var spawnedRoadVehicleId = CreateVehicle(route, new VehicleDimensions(12d, 2.55d, 3.2d), new VehiclePerformance(22.2222222222d, 1.2d, 3d, 2.5d, 2d));\n                    vehicle.RoadVehicleId = spawnedRoadVehicleId;'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one bus spawn block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MachiVerseWorks.Simulation/SimulationWorld.MultimodalTransit.cs
          git commit -m "fix: avoid bus road vehicle local name collision"
          git push origin HEAD:fix/all-open-issues-worker-1
