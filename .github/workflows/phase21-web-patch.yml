name: Phase21 web patch

on:
  push:
    branches: [feature/phase21-economy]
    paths: [.github/workflows/phase21-web-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase21-economy
      - name: Patch web economy integration
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path); s = p.read_text()
              if old not in s: raise SystemExit(f'missing anchor in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          # connection.ts
          replace('src/web/src/connection.ts',
              "import {\n  decodeTrafficFrame,\n  isTrafficFrame,\n  type TrafficProtocolMessage,\n} from './traffic-protocol.ts';\n",
              "import {\n  decodeTrafficFrame,\n  isTrafficFrame,\n  type TrafficProtocolMessage,\n} from './traffic-protocol.ts';\nimport {\n  decodeEconomyFrame,\n  isEconomyFrame,\n  type EconomyProtocolMessage,\n} from './economy-protocol.ts';\n")
          replace('src/web/src/connection.ts',
              'readonly onMessage: (message: ProtocolMessage | TrafficProtocolMessage | PopulationProtocolMessage | RailwayProtocolMessage | RailwayOperationsProtocolMessage | MultimodalTransitProtocolMessage) => void;',
              'readonly onMessage: (message: ProtocolMessage | TrafficProtocolMessage | PopulationProtocolMessage | RailwayProtocolMessage | RailwayOperationsProtocolMessage | MultimodalTransitProtocolMessage | EconomyProtocolMessage) => void;')
          replace('src/web/src/connection.ts',
              "      const multimodalTransitFrame = isMultimodalTransitFrame(buffer);\n      const railwayFrame = !multimodalTransitFrame && isRailwayFrame(buffer);",
              "      const economyFrame = isEconomyFrame(buffer);\n      const multimodalTransitFrame = !economyFrame && isMultimodalTransitFrame(buffer);\n      const railwayFrame = !economyFrame && !multimodalTransitFrame && isRailwayFrame(buffer);")
          replace('src/web/src/connection.ts',
              "      const envelope = multimodalTransitFrame\n        ? decodeMultimodalTransitFrame(buffer)",
              "      const envelope = economyFrame\n        ? decodeEconomyFrame(buffer)\n        : multimodalTransitFrame\n          ? decodeMultimodalTransitFrame(buffer)")
          replace('src/web/src/connection.ts',
              "if (!multimodalTransitFrame && !railwayFrame && !railwayOperationsFrame && !populationFrame && !trafficFrame && envelope.message.type === MessageType.Error)",
              "if (!economyFrame && !multimodalTransitFrame && !railwayFrame && !railwayOperationsFrame && !populationFrame && !trafficFrame && envelope.message.type === MessageType.Error)")
          replace('src/web/src/connection.ts',
              "if (!multimodalTransitFrame && !railwayFrame && !railwayOperationsFrame && !populationFrame && !trafficFrame && envelope.message.type === MessageType.Error)",
              "if (!economyFrame && !multimodalTransitFrame && !railwayFrame && !railwayOperationsFrame && !populationFrame && !trafficFrame && envelope.message.type === MessageType.Error)")

          # application.ts
          replace('src/web/src/application.ts',
              "import { WorldView } from './world-view.ts';\n",
              "import { WorldView } from './world-view.ts';\nimport { ECONOMY_SNAPSHOT_MESSAGE_TYPE, type EconomyProtocolMessage, type EconomySnapshotMessage } from './economy-protocol.ts';\n")
          replace('src/web/src/application.ts',
              "          this.ui.clearMultimodalTransit();\n          this.ui.setProtocol(null);",
              "          this.ui.clearMultimodalTransit();\n          this.ui.clearEconomy();\n          this.ui.setProtocol(null);")
          replace('src/web/src/application.ts',
              'private handleProtocolMessage(message: ProtocolMessage | TrafficProtocolMessage | PopulationProtocolMessage | RailwayProtocolMessage | RailwayOperationsProtocolMessage | MultimodalTransitProtocolMessage): void {',
              'private handleProtocolMessage(message: ProtocolMessage | TrafficProtocolMessage | PopulationProtocolMessage | RailwayProtocolMessage | RailwayOperationsProtocolMessage | MultimodalTransitProtocolMessage | EconomyProtocolMessage): void {')
          replace('src/web/src/application.ts',
              "      case MultimodalTransitMessageType.MultimodalTransitSnapshot: this.applyMultimodalTransit(message); return;\n",
              "      case MultimodalTransitMessageType.MultimodalTransitSnapshot: this.applyMultimodalTransit(message); return;\n      case ECONOMY_SNAPSHOT_MESSAGE_TYPE: this.applyEconomy(message); return;\n")
          replace('src/web/src/application.ts',
              "  private applyMultimodalTransit(message: MultimodalTransitSnapshotMessage): void { this.ui.setMultimodalTransit(message); }\n",
              "  private applyMultimodalTransit(message: MultimodalTransitSnapshotMessage): void { this.ui.setMultimodalTransit(message); }\n  private applyEconomy(message: EconomySnapshotMessage): void { this.ui.setEconomy(message); }\n")

          # ui.ts
          replace('src/web/src/ui.ts',
              "import { RailwayServiceState, type RailwayOperationsSnapshotMessage } from './railway-operations.ts';\n",
              "import { RailwayServiceState, type RailwayOperationsSnapshotMessage } from './railway-operations.ts';\nimport type { EconomySnapshotMessage } from './economy-protocol.ts';\n")
          replace('src/web/src/ui.ts',
              "  private readonly transitDebugValue = document.createElement('div');\n",
              "  private readonly transitDebugValue = document.createElement('div');\n  private readonly economyDebugValue = document.createElement('div');\n")
          replace('src/web/src/ui.ts',
              "    panel.append(transitDebug);\n\n    this.errorValue.className",
              "    panel.append(transitDebug);\n\n    const economyDebug = document.createElement('div');\n    economyDebug.className = 'economy-debug';\n    const economyDebugTitle = document.createElement('strong');\n    economyDebugTitle.textContent = localizer.t('economyDebug.title');\n    this.economyDebugValue.className = 'economy-debug-value';\n    economyDebug.append(economyDebugTitle, this.economyDebugValue);\n    panel.append(economyDebug);\n\n    this.errorValue.className")
          replace('src/web/src/ui.ts',
              "    this.clearMultimodalTransit();\n    this.setAudioState('locked');",
              "    this.clearMultimodalTransit();\n    this.clearEconomy();\n    this.setAudioState('locked');")
          replace('src/web/src/ui.ts',
              "  public clearMultimodalTransit(): void { this.transitDebugValue.textContent = this.localizer.t('transitDebug.none'); }\n\n  public setPersonDebug",
              "  public clearMultimodalTransit(): void { this.transitDebugValue.textContent = this.localizer.t('transitDebug.none'); }\n\n  public setEconomy(message: EconomySnapshotMessage): void {\n    const s = message.statistics;\n    const companies = message.companies.slice(0, 4).map((company) => `C${company.companyId.toString()}: ${company.employeeCount}人 / 売上 ${company.revenue.toString()}`).join(', ');\n    this.economyDebugValue.textContent = this.localizer.t('economyDebug.summary', { companies: s.companyCount, jobs: s.jobCount, employed: s.employedPersonCount, vacancies: s.vacantPositionCount, income: s.householdIncome, spending: s.householdSpending, revenue: s.companyRevenue, expense: s.companyExpense, produced: s.producedUnits.toFixed(1), cycle: s.economicCycle, details: companies || '—' });\n  }\n\n  public clearEconomy(): void { this.economyDebugValue.textContent = this.localizer.t('economyDebug.none'); }\n\n  public setPersonDebug")

          # localization
          p = Path('src/web/locales/ja-JP.json')
          data = json.loads(p.read_text())
          data['economyDebug.title'] = 'Economy Debug'
          data['economyDebug.none'] = '経済情報なし'
          data['economyDebug.summary'] = '企業 {companies} / Job {jobs} / 雇用 {employed} / 求人 {vacancies} / 世帯所得 {income} / 消費 {spending} / 売上 {revenue} / 費用 {expense} / 生産 {produced} / Cycle {cycle} / {details}'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          Path('.github/workflows/phase21-web-patch.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(web): integrate economy debug surface"
          git push origin HEAD:feature/phase21-economy
