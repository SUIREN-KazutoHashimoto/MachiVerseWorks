name: Phase 14 Intersection Control

on:
  push:
    branches:
      - develop
      - 'feature/**'
    paths:
      - 'src/MachiVerseWorks.Simulation/**'
      - 'src/MachiVerseWorks.Protocol/**'
      - 'src/MachiVerseWorks.Server/**'
      - 'src/web/**'
      - 'tests/**'
      - 'benchmarks/**'
      - '.github/workflows/phase14-intersection-control.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'src/MachiVerseWorks.Simulation/**'
      - 'src/MachiVerseWorks.Protocol/**'
      - 'src/MachiVerseWorks.Server/**'
      - 'src/web/**'
      - 'tests/**'
      - 'benchmarks/**'
      - '.github/workflows/phase14-intersection-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase14-intersection-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: intersection-signal-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Build and test
        shell: bash
        run: |
          set +e
          mkdir -p .artifacts/phase14-intersection-control
          dotnet build MachiVerseWorks.slnx --configuration Release --no-restore > .artifacts/phase14-intersection-control/build.log 2>&1
          status=$?
          cat .artifacts/phase14-intersection-control/build.log
          if [ "$status" -eq 0 ]; then
            dotnet test tests/MachiVerseWorks.Simulation.Tests/MachiVerseWorks.Simulation.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~IntersectionControlTests > .artifacts/phase14-intersection-control/test.log 2>&1
            status=$?
            cat .artifacts/phase14-intersection-control/test.log
          fi
          exit "$status"
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase14-intersection-control-${{ github.run_id }}
          path: .artifacts/phase14-intersection-control
          if-no-files-found: warn
          retention-days: 14
