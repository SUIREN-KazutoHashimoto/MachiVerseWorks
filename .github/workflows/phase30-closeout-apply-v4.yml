name: Phase30 Closeout Apply V4

on:
  push:
    branches: [feature/simulation-phase30]
    paths:
      - '.github/workflows/phase30-closeout-apply-v4.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/simulation-phase30
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Reapply validated Phase30 edits
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('.github/workflows/phase30-closeout-apply-v3.yml')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line == '      - name: Apply final Phase30 edits')
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: Restore'))
          script_lines = [line[10:] if line.startswith('          ') else line for line in lines[run_line + 1:end]]
          exec(compile('\n'.join(script_lines), str(source_path), 'exec'))

          roadmap = Path('roadmap/SIMULATION_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          text = text.replace('> **現在:** Phase 30 — Regional & Urban Generation（実装完了・develop統合待ち）  \n',
                              '> **現在:** Phase 30 — Regional & Urban Generation（実装完了・develop統合待ち）\n')
          text = text.replace('> **次の実装タスク:** Phase 31 `P31-001`  \n',
                              '> **次の実装タスク:** Phase 31 `P31-001`\n')
          text = text.replace('> **Protocol:** `2.18`  \n',
                              '> **Protocol:** `2.18`\n')
          roadmap.write_text(text, encoding='utf-8')

          Path('.github/workflows/phase30-closeout-apply-v4.yml').unlink(missing_ok=True)

      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx

      - name: Build
        run: dotnet build MachiVerseWorks.slnx --configuration Release --no-restore

      - name: Full test suite
        run: dotnet test MachiVerseWorks.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Closeout invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet origin/develop...HEAD -- VERSION; then
            echo 'VERSION must remain unchanged for Phase30 per user instruction.' >&2
            exit 1
          fi
          for path in \
            .github/workflows/phase30-closeout-apply.yml \
            .github/workflows/phase30-closeout-apply-v2.yml \
            .github/workflows/phase30-closeout-apply-v3.yml \
            .github/workflows/phase30-closeout-apply-v4.yml \
            phase30-closeout-diagnostic.txt; do
            test ! -e "$path"
          done
          test "$(grep -c -- '- ✅ \*\*P30-' roadmap/SIMULATION_ROADMAP.md)" -eq 35
          test "$(grep -c -- '- ⬜ \*\*P30-' roadmap/SIMULATION_ROADMAP.md)" -eq 0

      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(simulation): close out phase30 regional generation'
          git push origin HEAD:feature/simulation-phase30
