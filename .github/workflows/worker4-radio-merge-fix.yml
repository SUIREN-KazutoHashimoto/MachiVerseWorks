name: Worker 4 Radio Merge Fix

on:
  push:
    branches:
      - fix/all-open-issues-worker-4
    paths:
      - '.github/workflows/worker4-radio-merge-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Reconcile Radio merge hunk
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/MachiVerseWorks.Simulation/SimulationWorld.Radio.cs')
          text = path.read_text(encoding='utf-8')
          old = '''    public void RecalculateRadioPlan()\n    {\n        EnsureRadioCandidateIndexes();\n        foreach (var link in _radioLinks.OrderBy(static item => item.Id.Value))\n'''
          new = '''    public void RecalculateRadioPlan()\n    {\n        EnsureRadioCandidateIndexes();\n        var updates = new List<(RadioLinkStateData Link, RadioPropagationResult Propagation, RadioLinkState State)>();\n        foreach (var link in _radioLinks.OrderBy(static item => item.Id.Value))\n'''
          if old not in text:
              raise SystemExit('RecalculateRadioPlan merge hunk not found')
          text = text.replace(old, new, 1)

          old = '''    private double CalculateLegacyInterferenceDbm(RadioLinkStateData target, RadioSiteSnapshot targetReceiver)\n    {\n        var interferingMilliwatts = 0d;\n        if (!_overlappingFrequencyBlocks.TryGetValue(target.FrequencyBlockId, out var overlappingBlocks)) return -300d;\n        foreach (var blockId in overlappingBlocks)\n        {\n            if (!_legacyRadioLinksByBlock.TryGetValue(blockId, out var candidates)) continue;\n            foreach (var other in candidates)\n            {\n                if (other.Id == target.Id || _radioLinkEntityBindings.ContainsKey(other.Id) || !IsRadioLinkOperational(other)) continue;\n                var otherBlock = _frequencyBlockIndex[other.FrequencyBlockId];\n                var otherTransmitter = CreateRadioSiteSnapshot(_radioSiteIndex[other.FromSiteId]);\n                var obstruction = CalculateRadioBuildingObstruction(otherTransmitter.Position, targetReceiver.Position);\n                var interferenceRequest = new RadioPropagationRequest(\n                    otherTransmitter,\n                    targetReceiver,\n                    otherBlock,\n                    other.LinkBudget,\n                    -300d,\n                    RadioDefaults.ThermalNoiseFloorDbm,\n                    obstruction.LossDb,\n                    obstruction.IsLineOfSight);\n                var result = _radioPropagationSolver.Solve(interferenceRequest);\n                interferingMilliwatts += Math.Pow(10d, result.ReceivedPowerDbm / 10d);\n            }\n        }\n        return hasInterference ? combinedInterferenceDbm : -300d;\n    }\n'''
          new = '''    private double CalculateLegacyInterferenceDbm(RadioLinkStateData target, RadioSiteSnapshot targetReceiver)\n    {\n        var combinedInterferenceDbm = -300d;\n        var hasInterference = false;\n        if (!_overlappingFrequencyBlocks.TryGetValue(target.FrequencyBlockId, out var overlappingBlocks)) return -300d;\n        foreach (var blockId in overlappingBlocks)\n        {\n            if (!_legacyRadioLinksByBlock.TryGetValue(blockId, out var candidates)) continue;\n            foreach (var other in candidates)\n            {\n                if (other.Id == target.Id || _radioLinkEntityBindings.ContainsKey(other.Id) || !IsRadioLinkOperational(other)) continue;\n                var otherBlock = _frequencyBlockIndex[other.FrequencyBlockId];\n                var otherTransmitter = CreateRadioSiteSnapshot(_radioSiteIndex[other.FromSiteId]);\n                var obstruction = CalculateRadioBuildingObstruction(otherTransmitter.Position, targetReceiver.Position);\n                var interferenceRequest = new RadioPropagationRequest(\n                    otherTransmitter,\n                    targetReceiver,\n                    otherBlock,\n                    other.LinkBudget,\n                    -300d,\n                    RadioDefaults.ThermalNoiseFloorDbm,\n                    obstruction.LossDb,\n                    obstruction.IsLineOfSight);\n                var result = _radioPropagationSolver.Solve(interferenceRequest);\n                combinedInterferenceDbm = hasInterference\n                    ? DeterministicRadioPropagationSolver.CombinePowersDbm(combinedInterferenceDbm, result.ReceivedPowerDbm)\n                    : result.ReceivedPowerDbm;\n                hasInterference = true;\n            }\n        }\n        return hasInterference ? combinedInterferenceDbm : -300d;\n    }\n'''
          if old not in text:
              raise SystemExit('CalculateLegacyInterferenceDbm merge hunk not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/worker4-radio-merge-fix.yml
          git add src/MachiVerseWorks.Simulation/SimulationWorld.Radio.cs
          git commit -m 'fix(radio): reconcile parent sync changes'
          git push origin HEAD:fix/all-open-issues-worker-4
