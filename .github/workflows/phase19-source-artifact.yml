name: Phase 19 Source Artifact

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: phase19-worktree
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
