name: Phase30 Closeout Apply V3

on:
  push:
    branches: [feature/simulation-phase30]
    paths:
      - '.github/workflows/phase30-closeout-apply-v3.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/simulation-phase30
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Apply final Phase30 edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Reuse the already-reviewed closeout edit script, with its Analyzer correction.
          source_path = Path('.github/workflows/phase30-closeout-apply.yml')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line == '      - name: Apply Phase30 closeout edits')
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: Restore'))
          script_lines = [line[10:] if line.startswith('          ') else line for line in lines[run_line + 1:end]]
          script = '\n'.join(script_lines)
          script = script.replace(
              'private IReadOnlyList<HistoricalGrowthEvent> ApplyGrowthPressureRules',
              'private List<HistoricalGrowthEvent> ApplyGrowthPressureRules')
          exec(compile(script, str(source_path), 'exec'))

          # Settlement identity must remain unique even when terrain-grid quantization maps
          # multiple selected origins to the same deterministic cell.
          replace_once(
              'src/MachiVerseWorks.Simulation/RegionalGenerator.cs',
              '                Hash(candidate.Center.X, candidate.Center.Y, 0x5101UL));',
              '                Hash(candidate.Center.X, candidate.Center.Y, 0x5101UL ^ ((ulong)(index + 1) << 32)));')
          replace_once(
              'src/MachiVerseWorks.Simulation/RegionalGenerator.cs',
              '                new SettlementId(Hash(candidate.Center.X, candidate.Center.Y, 0x5102UL)),',
              '                new SettlementId(Hash(candidate.Center.X, candidate.Center.Y, 0x5102UL ^ ((ulong)(index + 1) << 32))),')

          # WorldVolume is the only core geometry value that lacked an explicit JSON constructor.
          replace_once(
              'src/MachiVerseWorks.Simulation/Geometry.cs',
              'public readonly record struct WorldVolume\n{\n    public WorldVolume(',
              'public readonly record struct WorldVolume\n{\n    [System.Text.Json.Serialization.JsonConstructor]\n    public WorldVolume(')

          # Protocol 2.18 is authoritative for regional generation.
          replace_once(
              'tests/MachiVerseWorks.Protocol.Tests/ProtocolVersionTests.cs',
              '    public void CurrentProtocolIs217AndAdvertisesWorldEnvironment()\n    {\n        Assert.AreEqual(new ProtocolVersion(2, 17), ProtocolVersion.Current);',
              '    public void CurrentProtocolIs218AndAdvertisesRegionalGeneration()\n    {\n        Assert.AreEqual(new ProtocolVersion(2, 18), ProtocolVersion.Current);')
          replace_once(
              'tests/MachiVerseWorks.Protocol.Tests/ProtocolVersionTests.cs',
              '        Assert.IsTrue(ProtocolVersion.Current.SupportsWorldEnvironment);\n',
              '        Assert.IsTrue(ProtocolVersion.Current.SupportsWorldEnvironment);\n        Assert.IsTrue(ProtocolVersion.Current.SupportsRegionalGeneration);\n')
          replace_once(
              'tests/MachiVerseWorks.Protocol.Tests/ProtocolVersionTests.cs',
              '        Assert.IsFalse(new ProtocolVersion(2, 16).SupportsWorldEnvironment);\n',
              '        Assert.IsFalse(new ProtocolVersion(2, 16).SupportsWorldEnvironment);\n        Assert.IsFalse(new ProtocolVersion(2, 17).SupportsRegionalGeneration);\n')
          replace_once(
              'tests/MachiVerseWorks.Protocol.Tests/ProtocolVersionTests.cs',
              '        Assert.IsFalse(supported.TryNegotiate(new ProtocolVersion(2, 18), out _));\n        Assert.IsFalse(supported.TryNegotiate(new ProtocolVersion(1, 17), out _));',
              '        Assert.IsFalse(supported.TryNegotiate(new ProtocolVersion(2, 19), out _));\n        Assert.IsFalse(supported.TryNegotiate(new ProtocolVersion(1, 18), out _));')

          # Remove temporary closeout machinery and diagnostics from the resulting branch.
          for path in (
              '.github/workflows/phase30-closeout-apply-v2.yml',
              '.github/workflows/phase30-closeout-apply-v3.yml',
              'phase30-closeout-diagnostic.txt',
          ):
              Path(path).unlink(missing_ok=True)

      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx

      - name: Build
        run: dotnet build MachiVerseWorks.slnx --configuration Release --no-restore

      - name: Full test suite
        run: dotnet test MachiVerseWorks.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Closeout invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet origin/develop...HEAD -- VERSION; then
            echo 'VERSION must remain unchanged for Phase30 per user instruction.' >&2
            exit 1
          fi
          test ! -e .github/workflows/phase30-closeout-apply.yml
          test ! -e .github/workflows/phase30-closeout-apply-v2.yml
          test ! -e .github/workflows/phase30-closeout-apply-v3.yml
          test ! -e phase30-closeout-diagnostic.txt
          test "$(grep -c -- '- ✅ \*\*P30-' roadmap/SIMULATION_ROADMAP.md)" -eq 35
          test "$(grep -c -- '- ⬜ \*\*P30-' roadmap/SIMULATION_ROADMAP.md)" -eq 0

      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(simulation): close out phase30 regional generation'
          git push origin HEAD:feature/simulation-phase30
