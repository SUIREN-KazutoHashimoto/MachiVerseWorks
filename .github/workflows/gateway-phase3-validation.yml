name: Gateway Phase3 Validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/MachiVerseWorks.Server/**'
      - 'src/MachiVerseWorks.Protocol/**'
      - 'tests/MachiVerseWorks.Server.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/gateway-phase3-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-phase3-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: server-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Run Server tests
        run: dotnet test tests/MachiVerseWorks.Server.Tests/MachiVerseWorks.Server.Tests.csproj --configuration Release --no-restore
