name: Worker1 Parent Sync

on:
  push:
    branches:
      - fix/all-open-issues-worker-1
    paths:
      - .github/workflows/worker1-sync-parent.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Merge parent branch
        run: |
          set -euo pipefail
          git fetch origin fix/all-open-issues
          git config user.name "Worker1 parent sync"
          git config user.email "noreply@github.com"
          git merge --no-ff origin/fix/all-open-issues -m "merge: sync latest fix/all-open-issues into worker1"
          git push origin HEAD:fix/all-open-issues-worker-1
