name: Optical Benchmark

on:
  push:
    branches: [develop]
    paths:
      - 'src/simulation/Optical.cs'
      - 'src/simulation/CapacityOpticalRoutingSolver.cs'
      - 'src/simulation/Geometry.cs'
      - 'src/simulation/Building*.cs'
      - 'src/simulation/WorldObjects.cs'
      - 'src/simulation/SimulationWorld.Building*.cs'
      - 'src/simulation/SimulationWorld.Optical*.cs'
      - 'src/simulation/SimulationWorld.cs'
      - 'src/simulation/SimulationNumeric.cs'
      - 'benchmarks/MachiVerseWorks.Benchmarks/OpticalBenchmarks.cs'
      - '.github/workflows/optical-benchmark.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'src/simulation/Optical.cs'
      - 'src/simulation/CapacityOpticalRoutingSolver.cs'
      - 'src/simulation/Geometry.cs'
      - 'src/simulation/Building*.cs'
      - 'src/simulation/WorldObjects.cs'
      - 'src/simulation/SimulationWorld.Building*.cs'
      - 'src/simulation/SimulationWorld.Optical*.cs'
      - 'src/simulation/SimulationWorld.cs'
      - 'src/simulation/SimulationNumeric.cs'
      - 'benchmarks/MachiVerseWorks.Benchmarks/OpticalBenchmarks.cs'
      - '.github/workflows/optical-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optical-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  optical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Run Optical 1k/5k benchmark
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/optical
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore -- --filter '*OpticalBenchmarks*' --job short
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-optical
          path: .artifacts/benchmarks/optical
          if-no-files-found: warn
          retention-days: 14