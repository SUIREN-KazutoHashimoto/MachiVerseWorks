name: Finalize Phase 3 roadmap

on:
  push:
    branches:
      - feature/phase-3-protocol
    paths:
      - '.github/workflows/finalize-phase3-roadmap.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/phase-3-protocol

      - name: Mark Phase 3 complete
        shell: python
        run: |
          from pathlib import Path

          path = Path('ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '> **現在:** Phase 2 — Simulation Core 最小 PoC完了  \n> **次の実装タスク:** `PRT-001` — Protocol version の表現方法を決める':
                  '> **現在:** Phase 3 — Protocol 最小実装完了  \n> **次の実装タスク:** `SRV-001` — Server project を単独起動できるようにする',
              '| 3 | Protocol 最小実装 | ⏭️ 次 |': '| 3 | Protocol 最小実装 | ✅ 完了 |',
              '| 4 | Headless Server 最小実装 | ⏳ 待機 |': '| 4 | Headless Server 最小実装 | ⏭️ 次 |',
              '<summary><strong>Phase 3 — Protocol 最小実装（次）</strong></summary>':
                  '<summary><strong>Phase 3 — Protocol 最小実装（完了）</strong></summary>',
              '<summary><strong>Phase 4 — Headless Server 最小実装（待機）</strong></summary>':
                  '<summary><strong>Phase 4 — Headless Server 最小実装（次）</strong></summary>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected ROADMAP text was not found: {old}')
              text = text.replace(old, new, 1)

          text = text.replace('- ⬜ **PRT-', '- ✅ **PRT-')
          path.write_text(text, encoding='utf-8')
          Path('VERSION').write_text('0.3.0\n', encoding='utf-8')

      - name: Commit finalized Phase 3 state
        run: |
          rm .github/workflows/finalize-phase3-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md VERSION .github/workflows/finalize-phase3-roadmap.yml
          git commit -m "Phase 3完了を記録"
          git push origin HEAD:feature/phase-3-protocol
