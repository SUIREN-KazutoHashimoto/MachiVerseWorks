name: Benchmarks

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'scripts/run-phase9-regression-benchmark.sh'
      - 'scripts/compare-benchmark-results.py'
      - 'scripts/select-ci-matrix.py'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'scripts/run-phase9-regression-benchmark.sh'
      - 'scripts/compare-benchmark-results.py'
      - 'scripts/select-ci-matrix.py'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: select affected benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select benchmark scope
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            selection="$(python scripts/select-ci-matrix.py benchmarks --base "$BASE_SHA" --head "$HEAD_SHA")"
          else
            selection="$(python scripts/select-ci-matrix.py benchmarks --full)"
          fi
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "Selection reason: $(jq -r '.reason' <<< "$selection")"
          echo "BenchmarkDotNet: $(jq -r '[.benchmarkdotnet.include[].name] | join(", ")' <<< "$selection")"
          echo "Scenario: $(jq -r '[.scenario.include[].name] | join(", ")' <<< "$selection")"

  benchmarkdotnet:
    name: ${{ matrix.name }}
    needs: select
    if: ${{ fromJSON(needs.select.outputs.selection).run_benchmarkdotnet }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.selection).benchmarkdotnet }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout benchmark base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .benchmark-base
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Restore benchmark base
        if: github.event_name == 'pull_request'
        working-directory: .benchmark-base
        run: dotnet restore MachiVerseWorks.slnx
      - name: Run base benchmark
        if: github.event_name == 'pull_request'
        working-directory: .benchmark-base
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/${{ matrix.id }}/base
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore -- --filter "${{ matrix.filter }}" --job short
      - name: Hide benchmark base project from BenchmarkDotNet discovery
        if: github.event_name == 'pull_request'
        run: >-
          mv .benchmark-base/benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj
          .benchmark-base/benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj.base
      - name: Run benchmark
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/${{ matrix.id }}/head
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore -- --filter "${{ matrix.filter }}" --job short
      - name: Compare benchmark regression
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/compare-benchmark-results.py
          --base ".artifacts/benchmarks/${{ matrix.id }}/base"
          --head ".artifacts/benchmarks/${{ matrix.id }}/head"
          --report ".artifacts/benchmarks/${{ matrix.id }}/comparison.json"
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-${{ matrix.id }}
          path: .artifacts/benchmarks/${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 14

  scenario:
    name: ${{ matrix.name }}
    needs: select
    if: ${{ fromJSON(needs.select.outputs.selection).run_scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.selection).scenario }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Run scenario benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ".artifacts/benchmarks/${{ matrix.id }}"
          dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore -- ${{ matrix.args }} \
            | tee ".artifacts/benchmarks/${{ matrix.id }}/results.csv"
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-${{ matrix.id }}
          path: .artifacts/benchmarks/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: benchmarkdotnet-smoke
    needs: select
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Build benchmarks
        run: dotnet build benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore
      - name: Run BenchmarkDotNet smoke
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/smoke
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-build -- --job Dry --filter '*'
      - name: Verify benchmark exports
        shell: bash
        run: |
          set -euo pipefail
          results=".artifacts/benchmarks/smoke/results"
          test -d "$results"
          find "$results" -type f -name '*.md' -print -quit | grep -q .
          find "$results" -type f -name '*.json' -print -quit | grep -q .
          find "$results" -type f -name '*.csv' -print -quit | grep -q .
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-smoke
          path: .artifacts/benchmarks/smoke
          if-no-files-found: error
          retention-days: 14

  snapshot-readmodel:
    name: snapshot-readmodel
    needs: select
    if: ${{ fromJSON(needs.select.outputs.selection).run_snapshot_readmodel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Build benchmark project
        run: dotnet build benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-restore
      - name: Measure read-model latency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/benchmarks/snapshot-readmodel
          dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-build -- --read-model-latency \
            | tee .artifacts/benchmarks/snapshot-readmodel/latency.csv
      - name: Run allocation benchmark
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/snapshot-readmodel
        run: dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj --configuration Release --no-build -- --filter '*PublishedReadModelBenchmarks*' --job short
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-snapshot-readmodel
          path: .artifacts/benchmarks/snapshot-readmodel
          if-no-files-found: error
          retention-days: 14

  regression:
    name: phase9-2d-to-3d-regression
    needs: select
    if: ${{ fromJSON(needs.select.outputs.selection).run_regression }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Run regression benchmark
        env:
          MACHIVERSE_PHASE9_REGRESSION_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/phase9-regression
        run: bash scripts/run-phase9-regression-benchmark.sh
      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-phase9-regression
          path: .artifacts/benchmarks/phase9-regression
          if-no-files-found: error
          retention-days: 14
