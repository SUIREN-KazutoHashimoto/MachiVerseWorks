name: Phase30 Mark Ready

on:
  push:
    branches:
      - feature/simulation-phase30
    paths:
      - '.github/workflows/phase30-mark-ready.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/simulation-phase30
          fetch-depth: 0

      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 225 --repo SUIREN-KazutoHashimoto/MachiVerseWorks

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase30-mark-ready.yml
          git commit -m 'chore: remove Phase30 ready helper'
          git push origin HEAD:feature/simulation-phase30
