name: Temporary approve VQ-0 road-interchange Golden

on:
  push:
    branches:
      - feat/view-vq0-user-facing-golden
    paths:
      - .github/workflows/temp-approve-vq0-road-interchange.yml

permissions:
  contents: write

env:
  SOURCE_RUN_ID: "33957270013"
  EXPECTED_SHA256: "3fbd271ace4d6b421c5eb383baea88f5c35b4c4d23f16af6478cb1be9bd87502"

jobs:
  approve:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/view-vq0-user-facing-golden
          fetch-depth: 0

      - name: Download reviewed clean-CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vq0
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name e2e-view-physical-world --dir /tmp/vq0
          echo "$EXPECTED_SHA256  /tmp/vq0/user-facing/actual/road-interchange.png" | sha256sum --check --strict

      - name: Commit approved Golden and remove temporary workflow
        run: |
          set -euo pipefail
          cp /tmp/vq0/user-facing/actual/road-interchange.png src/view/tests/visual/user-facing-golden/road-interchange.png
          git rm .github/workflows/temp-approve-vq0-road-interchange.yml
          git add src/view/tests/visual/user-facing-golden/road-interchange.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(view): approve stable road-interchange golden"
          git push origin HEAD:feat/view-vq0-user-facing-golden
