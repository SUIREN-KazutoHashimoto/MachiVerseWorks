name: Phase 18 Finalize

on:
  push:
    branches:
      - feature/phase18-railway-operations
    paths:
      - scripts/phase18-finalize.py
      - .github/workflows/phase18-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase18-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Apply Phase 18 closeout
        run: python scripts/phase18-finalize.py
      - name: Check whitespace
        run: git diff --check
      - name: Restore .NET
        run: dotnet restore MachiVerseWorks.slnx
      - name: Build .NET
        run: dotnet build MachiVerseWorks.slnx --configuration Release --no-restore
      - name: Test .NET
        run: dotnet test MachiVerseWorks.slnx --configuration Release --no-build
      - name: Test Web
        run: |
          npm --prefix src/web ci
          npm --prefix src/web run lint
          npm --prefix src/web test
          npm --prefix src/web run build
      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs: close out phase 18 railway operations'
          git push origin HEAD:feature/phase18-railway-operations
