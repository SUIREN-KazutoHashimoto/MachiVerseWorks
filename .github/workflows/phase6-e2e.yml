name: Phase 6 E2E

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: phase6-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Run end-to-end PoC
        run: bash scripts/run-phase6-e2e.sh

      - name: Upload Phase 6 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase6-e2e-artifacts
          path: .artifacts/phase6-e2e
          if-no-files-found: warn
          retention-days: 7
