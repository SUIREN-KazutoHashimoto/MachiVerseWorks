name: Worker 3 finalize E2E

on:
  push:
    branches:
      - fix/all-open-issues-worker-3
    paths:
      - '.github/workflows/worker3-finalize-e2e.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/all-open-issues-worker-3
          fetch-depth: 0
      - name: Remove duplicate PR trigger
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/e2e.yml')
          text = path.read_text(encoding='utf-8')
          block = """  pull_request:\n    branches:\n      - develop\n    paths:\n      - 'src/**'\n      - 'scripts/**'\n      - 'tests/fixtures/**'\n      - 'docs/development/baselines/**'\n      - 'Directory.Build.props'\n      - 'Directory.Packages.props'\n      - 'MachiVerseWorks.slnx'\n      - 'global.json'\n      - '.github/workflows/e2e.yml'\n"""
          if block not in text:
              raise SystemExit('expected pull_request block not found')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
      - name: Remove temporary workflow
        run: rm .github/workflows/worker3-finalize-e2e.yml
      - name: Commit final E2E trigger fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/e2e.yml .github/workflows/worker3-finalize-e2e.yml
          git commit -m 'ci: avoid duplicate e2e PR runs'
          git push origin HEAD:fix/all-open-issues-worker-3
