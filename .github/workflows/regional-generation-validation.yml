name: Regional Generation Validation

on:
  push:
    branches: [develop]
    paths:
      - 'src/simulation/Regional*.cs'
      - 'src/simulation/Settlement*.cs'
      - 'src/simulation/PersistentRegional*.cs'
      - 'src/simulation/SimulationWorld.Regional*.cs'
      - 'src/simulation/SimulationWorld.PersistentRegional*.cs'
      - 'src/simulation/SimulationWorld.cs'
      - 'src/simulation/TerrainModel.cs'
      - 'src/protocol/**'
      - 'src/persistence/**'
      - 'src/gateway/**'
      - 'tests/MachiVerseWorks.Simulation.Tests/*Regional*.cs'
      - 'tests/MachiVerseWorks.Simulation.Tests/*Settlement*.cs'
      - 'tests/MachiVerseWorks.Protocol.Tests/**'
      - 'tests/MachiVerseWorks.Persistence.Tests/**'
      - 'tests/MachiVerseWorks.Server.Tests/**'
      - '.github/workflows/regional-generation-validation.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'src/simulation/Regional*.cs'
      - 'src/simulation/Settlement*.cs'
      - 'src/simulation/PersistentRegional*.cs'
      - 'src/simulation/SimulationWorld.Regional*.cs'
      - 'src/simulation/SimulationWorld.PersistentRegional*.cs'
      - 'src/simulation/SimulationWorld.cs'
      - 'src/simulation/TerrainModel.cs'
      - 'src/protocol/**'
      - 'src/persistence/**'
      - 'src/gateway/**'
      - 'tests/MachiVerseWorks.Simulation.Tests/*Regional*.cs'
      - 'tests/MachiVerseWorks.Simulation.Tests/*Settlement*.cs'
      - 'tests/MachiVerseWorks.Protocol.Tests/**'
      - 'tests/MachiVerseWorks.Persistence.Tests/**'
      - 'tests/MachiVerseWorks.Server.Tests/**'
      - '.github/workflows/regional-generation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-generation-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx
      - name: Build
        run: dotnet build MachiVerseWorks.slnx --configuration Release --no-restore
      - name: Simulation Phase30 tests
        run: dotnet test tests/MachiVerseWorks.Simulation.Tests/MachiVerseWorks.Simulation.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~RegionalGeneration|FullyQualifiedName~RegionalMaterialization|FullyQualifiedName~RegionalUrbanRule'
      - name: Simulation Phase31 tests
        run: dotnet test tests/MachiVerseWorks.Simulation.Tests/MachiVerseWorks.Simulation.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~PersistentRegionalEvolution|FullyQualifiedName~RegionalPolycentricInteraction|FullyQualifiedName~SettlementTerritory'
      - name: Protocol Phase30 tests
        run: dotnet test tests/MachiVerseWorks.Protocol.Tests/MachiVerseWorks.Protocol.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~RegionalGeneration'
      - name: Protocol Phase31 tests
        run: dotnet test tests/MachiVerseWorks.Protocol.Tests/MachiVerseWorks.Protocol.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~PersistentRegionalEvolution'
      - name: Persistence regression
        run: dotnet test tests/MachiVerseWorks.Persistence.Tests/MachiVerseWorks.Persistence.Tests.csproj --configuration Release --no-build
      - name: Server regression
        run: dotnet test tests/MachiVerseWorks.Server.Tests/MachiVerseWorks.Server.Tests.csproj --configuration Release --no-build