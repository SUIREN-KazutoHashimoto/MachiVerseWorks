name: Phase 9 regression benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - 'benchmarks/**'
      - 'src/MachiVerseWorks.Protocol/**'
      - 'src/MachiVerseWorks.Simulation/**'
      - 'scripts/run-phase9-regression-benchmark.sh'
      - '.github/workflows/phase9-regression-benchmark.yml'

permissions:
  contents: read

jobs:
  compare-2d-to-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run Phase 9 regression benchmark
        env:
          MACHIVERSE_PHASE9_REGRESSION_ARTIFACTS: ${{ github.workspace }}/.artifacts/phase9-regression
        run: bash scripts/run-phase9-regression-benchmark.sh

      - name: Upload Phase 9 regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase9-regression-results
          path: .artifacts/phase9-regression
          if-no-files-found: error
          retention-days: 14
