name: Worker 2 issue fix batch

on:
  push:
    branches:
      - fix/all-open-issues-worker-2
    paths:
      - .github/workflows/worker-2-fix.yml
      - .github/scripts/worker2_batch4.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout assigned branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/all-open-issues-worker-2
          fetch-depth: 0
      - name: Align batch 4 script guards
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/scripts/worker2_batch4.py')
          text = path.read_text(encoding='utf-8')
          old = 'number_integer_count != 5'
          if text.count(old) != 1:
              raise SystemExit('Persistent Int32 guard marker mismatch')
          text = text.replace(old, 'number_integer_count != 7', 1)
          text = text.replace('expected 5 Number.isInteger Int32 uses', 'expected 7 Number.isInteger Int32 uses', 1)
          path.write_text(text, encoding='utf-8')
      - name: Apply final batch fixes
        run: python .github/scripts/worker2_batch4.py
      - name: Align generated validator analyzer compliance
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/MachiVerseWorks.Protocol/RailwayInfrastructureProtocolValidator.cs')
          text = path.read_text(encoding='utf-8')
          old = 'throw new ArgumentOutOfRangeException("message", $"{label} IDs must be unique and greater than zero.");'
          new = 'throw new ArgumentOutOfRangeException(nameof(ids), $"{label} IDs must be unique and greater than zero.");'
          if text.count(old) != 1:
              raise SystemExit('Railway validator CA2208 alignment target mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore build and test .NET
        shell: bash
        run: |
          set -euo pipefail
          target=MachiVerseWorks.slnx
          [[ -f "$target" ]] || target=MachiVerseWorks.sln
          dotnet restore "$target"
          dotnet build "$target" --configuration Release --no-restore
          dotnet test "$target" --configuration Release --no-build
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Test Web
        working-directory: src/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build
      - name: Commit final batch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 1
          git commit -m "fix: resolve worker 2 final issue batch (#311 #320 #324 #338 #340)"
          git push origin HEAD:fix/all-open-issues-worker-2
