name: Worker 2 cleanup

on:
  push:
    branches:
      - fix/all-open-issues-worker-2
    paths:
      - .github/workflows/worker-2-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assigned branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/all-open-issues-worker-2
          fetch-depth: 0
      - name: Remove temporary worker automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/scripts/worker2_batch1.py \
            .github/scripts/worker2_batch2.py \
            .github/scripts/worker2_batch3.py \
            .github/scripts/worker2_batch3_align.py \
            .github/scripts/worker2_batch4.py \
            .github/workflows/worker-2-fix.yml
          git commit -m "chore: remove worker 2 temporary automation"
          git push origin HEAD:fix/all-open-issues-worker-2
