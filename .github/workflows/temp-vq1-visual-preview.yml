name: Temporary VQ-1 visual preview

on:
  push:
    branches:
      - feature/view-vq1-environment
    paths:
      - .github/workflows/temp-vq1-visual-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: src/view/.node-version
          cache: npm
          cache-dependency-path: src/view/package-lock.json

      - name: Install pinned visual browser
        shell: bash
        env:
          MVW_VISUAL_BROWSER_VERSION: '152.0.7977.75'
        run: |
          set -euo pipefail
          browser="$(bash scripts/install-visual-browser.sh "$RUNNER_TEMP/machiverseworks-visual-browser")"
          echo "MVW_VISUAL_BROWSER=$browser" >> "$GITHUB_ENV"
          echo "MVW_VISUAL_BROWSER_VERSION=$MVW_VISUAL_BROWSER_VERSION" >> "$GITHUB_ENV"

      - name: Install pinned Japanese visual font
        shell: bash
        env:
          MVW_VISUAL_FONT_PACKAGE_VERSION: '1:20230817+repack1-3'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "fonts-noto-cjk=$MVW_VISUAL_FONT_PACKAGE_VERSION"
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = "$MVW_VISUAL_FONT_PACKAGE_VERSION"
          mkdir -p "$HOME/.config/fontconfig"
          cat > "$HOME/.config/fontconfig/fonts.conf" <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>sans-serif</family>
              <prefer><family>Noto Sans CJK JP</family></prefer>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f
          test "$(fc-match -f '%{family}\n' sans-serif | head -n 1 | cut -d, -f1)" = 'Noto Sans CJK JP'
          echo "MVW_VISUAL_FONT_FAMILY=Noto Sans CJK JP" >> "$GITHUB_ENV"
          echo "MVW_VISUAL_FONT_PACKAGE_VERSION=$MVW_VISUAL_FONT_PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Bypass unrelated runtime structural capture for preview only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-view-phase03-e2e.sh')
          text = path.read_text()
          text = text.replace('node "$ROOT_DIR/scripts/run-headless-runtime-visual-e2e.mjs" "$CHROME" "$RUNTIME_URL" "$RUNTIME_ARTIFACT_DIR"', 'echo "Skipping runtime structural screenshot in VQ-1 preview."')
          text = text.replace('node "$ROOT_DIR/scripts/check-runtime-visual-golden.mjs" "$RUNTIME_ARTIFACT_DIR" "$RUNTIME_GOLDEN_FILE"', 'true')
          text = text.replace('cat "$RUNTIME_ARTIFACT_DIR/summary.json"', 'echo "Runtime structural summary skipped in VQ-1 preview."')
          path.write_text(text)
          PY

      - name: Run VQ-1 preview
        env:
          MVW_UPDATE_VISUAL_GOLDEN: '1'
          MVW_UPDATE_USER_FACING_GOLDEN: '1'
        run: bash scripts/run-view-phase03-e2e.sh

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vq1-visual-preview
          path: .artifacts/view-phase03-e2e
          if-no-files-found: error
          retention-days: 7
