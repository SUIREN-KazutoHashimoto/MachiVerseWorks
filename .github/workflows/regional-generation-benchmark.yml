name: Regional Generation Benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/simulation/Regional*.cs'
      - 'src/simulation/Settlement*.cs'
      - 'src/simulation/PersistentRegional*.cs'
      - 'src/simulation/WorldEnvironment*.cs'
      - 'src/simulation/Geometry.cs'
      - 'src/simulation/SimulationConfig.cs'
      - 'src/simulation/Road*.cs'
      - 'src/simulation/Building*.cs'
      - 'src/simulation/Population*.cs'
      - 'src/simulation/Economy*.cs'
      - 'src/simulation/SimulationWorld.Regional*.cs'
      - 'src/simulation/SimulationWorld.PersistentRegional*.cs'
      - 'src/simulation/SimulationWorld.Road*.cs'
      - 'src/simulation/SimulationWorld.Building*.cs'
      - 'src/simulation/SimulationWorld.Population*.cs'
      - 'src/simulation/SimulationWorld.Economy*.cs'
      - 'src/simulation/SimulationWorld.cs'
      - 'src/simulation/SimulationNumeric.cs'
      - 'src/simulation/TerrainModel.cs'
      - 'benchmarks/MachiVerseWorks.Benchmarks/RegionalGenerationBenchmarks.cs'
      - 'scripts/compare-benchmark-results.py'
      - '.github/workflows/regional-generation-benchmark.yml'

permissions:
  contents: read

jobs:
  regional-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout benchmark base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .benchmark-base

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MachiVerseWorks.slnx

      - name: Restore benchmark base
        if: github.event_name == 'pull_request'
        working-directory: .benchmark-base
        run: dotnet restore MachiVerseWorks.slnx

      - name: Run base Regional Generation benchmark
        if: github.event_name == 'pull_request'
        working-directory: .benchmark-base
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/regional-generation/base
        run: >-
          dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj
          --configuration Release --no-restore --
          --filter '*RegionalGenerationBenchmarks*' --job short

      - name: Hide benchmark base project from BenchmarkDotNet discovery
        if: github.event_name == 'pull_request'
        run: >-
          mv .benchmark-base/benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj
          .benchmark-base/benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj.base

      - name: Run Regional Generation benchmark
        env:
          MACHIVERSE_BENCHMARK_ARTIFACTS: ${{ github.workspace }}/.artifacts/benchmarks/regional-generation/head
        run: >-
          dotnet run --project benchmarks/MachiVerseWorks.Benchmarks/MachiVerseWorks.Benchmarks.csproj
          --configuration Release --no-restore --
          --filter '*RegionalGenerationBenchmarks*' --job short

      - name: Compare benchmark regression
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/compare-benchmark-results.py
          --base .artifacts/benchmarks/regional-generation/base
          --head .artifacts/benchmarks/regional-generation/head
          --report .artifacts/benchmarks/regional-generation/comparison.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-regional-generation
          path: .artifacts/benchmarks/regional-generation
          if-no-files-found: warn
          retention-days: 14