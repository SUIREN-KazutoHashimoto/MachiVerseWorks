name: Phase 18 Railway Operations E2E

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'perf/**'
    paths:
      - 'src/MachiVerseWorks.Simulation/**'
      - 'src/MachiVerseWorks.Persistence/**'
      - 'src/MachiVerseWorks.Protocol/**'
      - 'src/MachiVerseWorks.Server/**'
      - 'src/web/**'
      - 'scripts/run-phase18-e2e.sh'
      - '.github/workflows/phase18-e2e.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'src/MachiVerseWorks.Simulation/**'
      - 'src/MachiVerseWorks.Persistence/**'
      - 'src/MachiVerseWorks.Protocol/**'
      - 'src/MachiVerseWorks.Server/**'
      - 'src/web/**'
      - 'scripts/run-phase18-e2e.sh'
      - '.github/workflows/phase18-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase18-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: railway-operations-server-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.node-version
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Run Phase 18 end-to-end
        run: bash scripts/run-phase18-e2e.sh
      - name: Upload Phase 18 artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase18-e2e-artifacts
          path: .artifacts/phase18-e2e
          if-no-files-found: warn
          retention-days: 7
